<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Learning App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Apprendre le Français</h1>
            <p>ისწავლე ფრანგული პროფესიონალურად</p>
        </div>

        <div style="padding: 25px;">
            <h2 style="margin-bottom: 20px;">აირჩიე გაკვეთილი:</h2>
            
            <a href="lesson1.html" style="text-decoration: none; color: inherit;">
                <div class="word-card" style="display: flex; align-items: center; gap: 20px;">
                    <span style="font-size: 2.5rem;">👋</span>
                    <div>
                        <strong style="font-size: 1.2rem; display: block;">გაკვეთილი 1: მისალმება</strong>
                        <small style="color: #718096;">კულტურული კონტექსტი, Tu vs Vous</small>
                    </div>
                </div>
            </a>
            
            </div>
    </div>
</body>
</html>

<script>
    window.onload = function() {
        const progress = localStorage.getItem('lesson1_complete') || 0;
        if(progress == 100) {
            // აქ კოდი რომელიც გაამწვანებს ბარათს
            document.getElementById('lesson1-card').style.borderColor = '#2ecc71';
            document.getElementById('lesson1-percent').innerText = '100%';
        }
    }
</script>
