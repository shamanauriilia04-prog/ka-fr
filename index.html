<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ისწავლე ფრანგული</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-page" class="app-container">
        <header class="header-card">
            <div class="header-decoration">🇫🇷</div>
            <h1>Bonjour ! 👋</h1>
            <p>მზად ხარ ფრანგულის სასწავლად?</p>
        </header>

        <div class="content">
            <div class="progress-card">
                <div class="progress-header">
                    <span>A1 დონე</span>
                    <span id="progress-text">0% მზადაა</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="lesson-card" onclick="openLesson('alphabet')">
                <div class="icon-box">🔡</div>
                <div class="lesson-info">
                    <h3>L'Alphabet</h3>
                    <p>ანბანი და გამოთქმა</p>
                </div>
                <div class="chevron">›</div>
            </div>
            </div>
    </div>

    <div id="lesson-page" class="lesson-overlay" style="display: none;">
        <header class="lesson-header">
            <button class="back-btn" onclick="closeLesson()">✕</button>
            <h2 id="lesson-title">L'Alphabet</h2>
        </header>
        <div id="lesson-content" class="lesson-body">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
