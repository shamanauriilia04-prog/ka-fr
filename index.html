<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Learning AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="welcome-banner">
            <h1>Bonjour! 🇫🇷</h1>
            <div id="total-status">საერთო პროგრესი: 0%</div>
        </div>
        <div class="lesson-grid" id="menu-grid"></div>
    </div>
    <script>
        const lessons = [
            { id: 'hello', name: 'მისალმება', icon: '👋', file: 'lesson1.html' },
            { id: 'etre', name: 'ზმნა Être', icon: '⚙️', file: 'lesson2.html' },
            { id: 'numbers', name: 'რიცხვები', icon: '🔢', file: 'lesson3.html' }
        ];
        function render() {
            const grid = document.getElementById('menu-grid');
            let total = 0;
            grid.innerHTML = lessons.map(l => {
                const p = localStorage.getItem(l.id + "_percent") || 0;
                const done = localStorage.getItem(l.id + "_completed") === "true";
                total += parseInt(p);
                return `<a href="${l.file}" class="lesson-card ${done ? 'completed' : ''}">
                    <div style="font-size:1.5rem; margin-right:15px;">${l.icon}</div>
                    <div style="flex:1"><h3>${l.name}</h3><div class="mini-progress"><div class="mini-progress-fill" style="width:${p}%"></div></div></div>
                    <span style="font-size:0.8rem; color:var(--success); font-weight:bold; margin-left:10px;">${p}%</span>
                </a>`;
            }).join('');
            document.getElementById('total-status').innerText = `პროგრესი: ${Math.round(total/lessons.length)}%`;
        }
        window.onload = render;
    </script>
</body>
</html>
