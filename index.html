<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonjour AI</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="welcome-banner"><h1>Bonjour! 🇫🇷</h1><p id="stat">პროგრესი: 0%</p></div>
        <div class="lesson-grid" id="menu"></div>
    </div>
    <script>
        const pages = [
            { id: 'hello', n: 'მისალმება', i: '👋', f: 'hello.html' },
            { id: 'etre', n: 'ზმნა Être', i: '⚙️', f: 'etre.html' },
            { id: 'avoir', n: 'ზმნა Avoir', i: '💎', f: 'avoir.html' },
            { id: 'numbers', n: 'რიცხვები', i: '🔢', f: 'numbers.html' },
            { id: 'family', n: 'ოჯახი', i: '👨‍👩‍👧', f: 'family.html' },
            { id: 'food', n: 'საჭმელი', i: '🍏', f: 'food.html' },
            { id: 'time', n: 'დრო', i: '📅', f: 'time.html' }
        ];
        const menu = document.getElementById('menu');
        let total = 0;
        pages.forEach(p => {
            const pct = localStorage.getItem(p.id + "_percent") || 0;
            total += parseInt(pct);
            menu.innerHTML += `
                <a href="${p.f}" class="lesson-card ${pct>=100?'completed':''}">
                    <div style="font-size:1.5rem; margin-right:15px;">${p.i}</div>
                    <div style="flex:1"><b>${p.n}</b><div style="height:4px; background:#eee; margin-top:5px;"><div style="height:100%; background:var(--success); width:${pct}%"></div></div></div>
                    <span style="margin-left:10px; font-weight:bold; color:var(--success)">${pct}%</span>
                </a>`;
        });
        document.getElementById('stat').innerText = "პროგრესი: " + Math.round(total/pages.length) + "%";
    </script>
</body>
</html>
