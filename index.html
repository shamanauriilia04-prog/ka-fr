<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonjour - მთავარი</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .welcome-banner {
            background: linear-gradient(135deg, #002395 0%, #ed2939 100%);
            padding: 40px 20px; color: white; text-align: center;
            border-radius: 0 0 40px 40px; margin-bottom: 30px;
        }
        .stats-row {
            display: flex; justify-content: space-around; margin-top: 20px;
            background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px;
        }
        .stat-item span { display: block; font-size: 0.8rem; opacity: 0.8; }
        
        .lesson-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 40px; }
        .lesson-card {
            background: white; padding: 20px; border-radius: 25px;
            text-decoration: none; color: #2d3436;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s; display: flex; flex-direction: column; align-items: center;
            text-align: center; border: 1px solid #eee;
        }
        .lesson-card:active { transform: scale(0.95); }
        .icon-circle {
            width: 60px; height: 60px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 15px;
        }
        
        /* ფერები სხვადასხვა კატეგორიისთვის */
        .bg-blue { background: #eef2ff; color: #002395; }
        .bg-red { background: #fff1f2; color: #ed2939; }
        .bg-green { background: #f0fdf4; color: #22c55e; }
        .bg-purple { background: #f5f3ff; color: #7c3aed; }
        .bg-orange { background: #fff7ed; color: #f97316; }
        .bg-cyan { background: #ecfeff; color: #0891b2; }
        .bg-pink { background: #fdf2f8; color: #db2777; }

        .lesson-card h3 { margin: 0; font-size: 1rem; }
        .lesson-card p { margin: 5px 0 0; font-size: 0.8rem; color: #636e72; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="welcome-banner">
            <h1>Bonjour! 🇫🇷</h1>
            <p>ისწავლე ფრანგული მარტივად</p>
            <div class="stats-row">
                <div class="stat-item"><strong>9</strong><span>გაკვეთილი</span></div>
                <div class="stat-item"><strong>A1</strong><span>დონე</span></div>
                <div class="stat-item"><strong>100%</strong><span>უფასო</span></div>
            </div>
        </div>

        <div class="lesson-grid">
            <a href="greetings.html" class="lesson-card">
                <div class="icon-circle bg-blue">👋</div>
                <h3>მისალმება</h3>
                <p>საუბრის დასაწყისი</p>
            </a>

            <a href="dialogues.html" class="lesson-card">
                <div class="icon-circle bg-green">💬</div>
                <h3>დიალოგები</h3>
                <p>ცოცხალი საუბარი</p>
            </a>

            <a href="verbs.html" class="lesson-card">
                <div class="icon-circle bg-red">⚙️</div>
                <h3>ზმნები</h3>
                <p>Être & Avoir</p>
            </a>

            <a href="numbers.html" class="lesson-card">
                <div class="icon-circle bg-green">🔢</div>
                <h3>რიცხვები</h3>
                <p>1-დან 100-მდე</p>
            </a>

            <a href="colors.html" class="lesson-card">
                <div class="icon-circle bg-cyan">🎨</div>
                <h3>ფერები</h3>
                <p>გარე სამყარო</p>
            </a>

            <a href="clothes.html" class="lesson-card">
                <div class="icon-circle bg-pink">👕</div>
                <h3>ტანსაცმელი</h3>
                <p>რა გვაცვია?</p>
            </a>

            <a href="family.html" class="lesson-card">
                <div class="icon-circle bg-blue">👨‍👩‍👧</div>
                <h3>ოჯახი</h3>
                <p>ახლობლები</p>
            </a>

            <a href="time.html" class="lesson-card">
                <div class="icon-circle bg-purple">📅</div>
                <h3>დრო</h3>
                <p>კალენდარი</p>
            </a>

            <a href="food.html" class="lesson-card">
                <div class="icon-circle bg-orange">🍏</div>
                <h3>საჭმელი</h3>
                <p>პროდუქტები</p>
            </a>
        </div>
    </div>
</body>
</html>
