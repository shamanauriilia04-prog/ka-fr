<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>რიცხვები - Progress Mode</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --accent: #2ecc71; --success: #27ae60; }
        .progress-container { width: 100%; height: 10px; background: #eee; position: sticky; top: 0; z-index: 100; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: 0.4s; }
        
        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 15px; scrollbar-width: none; background: #fff; }
        .tab { padding: 10px 20px; background: #f0f0f0; border-radius: 15px; white-space: nowrap; cursor: pointer; font-weight: bold; border: none; }
        .tab.active { background: var(--accent); color: white; }

        .verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .verb-card {
            background: #fff; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid transparent;
            position: relative; text-align: center; transition: 0.3s;
        }
        .verb-card.learned { border-color: var(--accent); background: #f0fff4; }
        .verb-card strong { display: block; color: var(--accent); font-size: 1.3rem; }
        
        .card-tools { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; }
        .tool-btn { background: #f0f0f0; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        #test-btn {
            display: none; margin: 20px; padding: 18px; background: var(--success); color: white; 
            border: none; border-radius: 15px; font-weight: bold; width: calc(100% - 40px); cursor: pointer;
            box-shadow: 0 5px 15px rgba(39,174,96,0.3);
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 30% auto; padding: 30px; border-radius: 25px; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div class="progress-container"><div id="progress-bar"></div></div>
    
    <div class="app-container">
        <div class="header" style="padding:15px; background: var(--accent); color:white;">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h2 style="margin:0">LES NOMBRES</h2>
        </div>

        <div class="category-scroll">
            <button class="tab active" onclick="setCat('1-19')">1-19</button>
            <button class="tab" onclick="setCat('20-69')">20-69</button>
            <button class="tab" onclick="setCat('70-89')">70-89</button>
            <button class="tab" onclick="setCat('90-100')">90-100</button>
        </div>

        <div id="dataGrid" class="verb-grid"></div>
        <button id="test-btn" onclick="startTest()">🏆 ჩააბარე ტესტი (100%)</button>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <button onclick="closeModal()" style="background:var(--accent); color:white; border:none; padding:12px; width:100%; border-radius:12px;">გავიგე</button>
        </div>
    </div>

    <script>
        const lessonId = "numbers_lesson";
        const library = [
            { fr: "Un", ka: "1", cat: "1-19", tip: "[ენ]" },
            { fr: "Deux", ka: "2", cat: "1-19", tip: "[დე]" },
            { fr: "Trois", ka: "3", cat: "1-19", tip: "[ტრუა]" },
            { fr: "Quatre", ka: "4", cat: "1-19", tip: "[კატრ]" },
            { fr: "Cinq", ka: "5", cat: "1-19", tip: "[სენკ]" },
            { fr: "Six", ka: "6", cat: "1-19", tip: "[სის]" },
            { fr: "Sept", ka: "7", cat: "1-19", tip: "[სეტ]" },
            { fr: "Huit", ka: "8", cat: "1-19", tip: "[უიტ]" },
            { fr: "Neuf", ka: "9", cat: "1-19", tip: "[ნეფ]" },
            { fr: "Dix", ka: "10", cat: "1-19", tip: "[დის]" },
            { fr: "Vingt", ka: "20", cat: "20-69", tip: "[ვენ]" },
            { fr: "Trente", ka: "30", cat: "20-69", tip: "[ტრანტ]" },
            { fr: "Quarante", ka: "40", cat: "20-69", tip: "[კარანტ]" },
            { fr: "Cinquante", ka: "50", cat: "20-69", tip: "[სენკანტ]" },
            { fr: "Soixante", ka: "60", cat: "20-69", tip: "[სუასანტ]" },
            { fr: "Soixante-dix", ka: "70", cat: "70-89", tip: "60+10" },
            { fr: "Quatre-vingts", ka: "80", cat: "70-89", tip: "4x20" },
            { fr: "Quatre-vingt-dix", ka: "90", cat: "90-100", tip: "4x20+10" },
            { fr: "Cent", ka: "100", cat: "90-100", tip: "[სან]" }
        ];

        let learnedWords = JSON.parse(localStorage.getItem(lessonId)) || [];
        let activeCat = "1-19";

        function setCat(cat) {
            activeCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === cat));
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('dataGrid');
            const filtered = library.filter(n => n.cat === activeCat);
            grid.innerHTML = filtered.map((item, i) => `
                <div class="verb-card ${learnedWords.includes(item.fr) ? 'learned' : ''}" id="card-${item.fr}">
                    <div class="card-tools">
                        <button class="tool-btn" onclick="handleListen('${item.fr}')">🔊</button>
                        <button class="tool-btn" onclick="showTip('${item.fr}')">?</button>
                    </div>
                    <strong>${item.fr}</strong>
                    <span>${item.ka}</span>
                </div>
            `).join('');
            updateProgress();
        }

        function handleListen(text) {
            speak(text);
            if (!learnedWords.includes(text)) {
                learnedWords.push(text);
                localStorage.setItem(lessonId, JSON.stringify(learnedWords));
                const card = document.getElementById(`card-${text}`);
                if(card) card.classList.add('learned');
                updateProgress();
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.85;
            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.startsWith('fr') && v.name.includes('Google'));
            if (frVoice) u.voice = frVoice;
            window.speechSynthesis.speak(u);
        }

        function updateProgress() {
            const percent = (learnedWords.length / library.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            if (percent >= 100) document.getElementById('test-btn').style.display = 'block';
            localStorage.setItem(lessonId + "_percent", Math.round(percent));
        }

        function startTest() {
            alert("გილოცავთ! 100-მდე რიცხვები ათვისებულია.");
            localStorage.setItem(lessonId + "_completed", "true");
            window.location.href = "index.html";
        }

        function showTip(fr) {
            const item = library.find(n => n.fr === fr);
            document.getElementById('modal-title').innerText = item.fr;
            document.getElementById('modal-text').innerText = item.tip;
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
        window.speechSynthesis.onvoiceschanged = () => renderGrid();
        renderGrid();
    </script>
</body>
</html>
