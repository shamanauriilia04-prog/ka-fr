<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avoir - სრული კურსი</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* სტილები იგივეა რაც ზემოთ, მხოლოდ ფერებია სხვა */
        .verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .verb-card { background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #e0e0e0; text-align: center; }
        .verb-card strong { color: #ED2939; font-size: 1.1rem; }
        .practice-box { background: #fff5f5; border-radius: 25px; padding: 25px; border: 2px solid #ffebeb; }
        .btn-speak { background: #ED2939; color: white; }
        .btn-mic { background: #333; color: white; }
        input[type="text"]:focus { border-color: #ED2939; }
        .next-btn { width: 100%; background: #ED2939; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="padding:15px; background: #ED2939;">
            <a href="verbs.html" style="color:white; float:left; text-decoration:none;">← უკან</a>
            <h2>AVOIR (ქონა)</h2>
        </div>

        <div style="padding: 20px;">
            <h3>1. სრული უღლება</h3>
            <div class="verb-grid">
                <div class="verb-card" onclick="speak('J\'ai')"><strong>J'ai</strong><span>მე მაქვს</span></div>
                <div class="verb-card" onclick="speak('Tu as')"><strong>Tu as</strong><span>შენ გაქვს</span></div>
                <div class="verb-card" onclick="speak('Il a')"><strong>Il a</strong><span>მას აქვს</span></div>
                <div class="verb-card" onclick="speak('Nous avons')"><strong>Nous avons</strong><span>ჩვენ გვაქვს</span></div>
                <div class="verb-card" onclick="speak('Vous avez')"><strong>Vous avez</strong><span>თქვენ გაქვთ</span></div>
                <div class="verb-card" onclick="speak('Ils ont')"><strong>Ils ont</strong><span>მათ აქვთ</span></div>
            </div>

            <div class="practice-box">
                <h3 style="margin-top:0;">2. პრაქტიკა: თქვი და დაწერე</h3>
                <p id="ka-phrase" style="font-size: 1.2rem; font-weight: bold;">მე მაქვს იდეა</p>
                
                <div class="control-btns">
                    <button class="action-btn btn-speak" onclick="speakTarget()">🔊 მოსმენა</button>
                    <button id="mic-btn" class="action-btn btn-mic" onclick="listen()">🎤 თქვი</button>
                </div>

                <input type="text" id="write-input" placeholder="აკრიფე ფრანგულად..." oninput="checkWriting()">
                <div id="feedback" style="margin-top:10px; font-weight:bold; text-align:center;"></div>

                <button class="next-btn" onclick="nextExercise()">შემდეგი დავალება →</button>
            </div>
        </div>
    </div>

    <script>
        const exercises = [
            { ka: "მე მაქვს იდეა", fr: "J'ai une idée" },
            { ka: "შენ გაქვს ძაღლი", fr: "Tu as un chien" },
            { ka: "მას აქვს მანქანა", fr: "Il a une voiture" },
            { ka: "ჩვენ გვაქვს დრო", fr: "Nous avons le temps" },
            { ka: "თქვენ გაქვთ კითხვა", fr: "Vous avez une question" },
            { ka: "მათ აქვთ სახლი", fr: "Ils ont une maison" }
        ];
        let currentIdx = 0;

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }

        function speakTarget() { speak(exercises[currentIdx].fr); }

        function listen() {
            const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            recognition.lang = 'fr-FR';
            recognition.onresult = (e) => {
                if(e.results[0][0].transcript.toLowerCase().includes(exercises[currentIdx].fr.toLowerCase())) 
                    showFeedback(true, "ხმა: ✅");
                else showFeedback(false, "ხმა: ❌");
            };
            recognition.start();
        }

        function checkWriting() {
            if(document.getElementById('write-input').value.toLowerCase() === exercises[currentIdx].fr.toLowerCase())
                showFeedback(true, "წერა: ✅ სწორია!");
        }

        function showFeedback(isOk, text) {
            const fb = document.getElementById('feedback');
            fb.innerText = text;
            fb.style.color = isOk ? "#2ecc71" : "#ED2939";
        }

        function nextExercise() {
            currentIdx = (currentIdx + 1) % exercises.length;
            document.getElementById('ka-phrase').innerText = exercises[currentIdx].ka;
            document.getElementById('write-input').value = "";
            document.getElementById('feedback').innerText = "";
        }
    </script>
</body>
</html>
