<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>გამოწვევა - Bonjour</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .challenge-container { text-align: center; padding: 40px 20px; position: relative; }
        .word-display {
            background: #fff; padding: 40px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px;
            min-height: 180px; display: flex; flex-direction: column;
            justify-content: center; position: relative;
        }
        .info-btn {
            position: absolute; top: 15px; right: 15px;
            background: #f0f2f5; border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer; font-weight: bold; color: #002395;
        }
        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white; margin: 30% auto; padding: 25px;
            border-radius: 20px; width: 80%; max-width: 350px; text-align: left;
        }
        .close-modal { background: #002395; color: white; border: none; padding: 10px 20px; border-radius: 10px; margin-top: 15px; width: 100%; }
        
        /* დანარჩენი სტილები იგივეა */
        .word-display h2 { font-size: 2.2rem; color: #002395; margin: 0; }
        .word-display p { font-size: 1.1rem; color: #636e72; margin-top: 10px; }
        .controls { display: flex; justify-content: center; gap: 20px; }
        .btn-round { width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .btn-audio { background: #002395; }
        .btn-mic { background: #ED2939; }
        .recording { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(237, 41, 57, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(237, 41, 57, 0); } 100% { box-shadow: 0 0 0 0 rgba(237, 41, 57, 0); } }
        #progress-text { margin-bottom: 10px; font-weight: bold; color: #002395; }
        .feedback { font-size: 1.2rem; margin-top: 15px; height: 25px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="padding:15px;">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h2>პირველი ნაბიჯები</h2>
        </div>

        <div class="challenge-container">
            <div id="progress-text">იტვირთება...</div>
            
            <div class="word-display" id="display-box">
                <button class="info-btn" onclick="showTip()">?</button>
                <h2 id="fr-word">-</h2>
                <p id="ka-word">-</p>
                <div id="feedback" class="feedback"></div>
            </div>

            <div class="controls">
                <button class="btn-round btn-audio" onclick="playCurrent()">🔊</button>
                <button class="btn-round btn-mic" id="mic-btn" onclick="startChallenge()">🎤</button>
            </div>
        </div>
    </div>

    <div id="tipModal" class="modal">
        <div class="modal-content">
            <h3 id="tip-title">როდის ვიყენებთ?</h3>
            <p id="tip-text"></p>
            <button class="close-modal" onclick="closeModal()">გავიგე</button>
        </div>
    </div>

    <script>
        const vocabulary = [
            { fr: "Bonjour", ka: "გამარჯობა", tip: "გამოიყენება მზის ჩასვლამდე. ეს არის ყველაზე ზოგადი და თავაზიანი ფორმა ნებისმიერ სიტუაციაში." },
            { fr: "Salut", ka: "სალამი", tip: "შინაურული ფორმაა. გამოიყენება მეგობრებთან და ახლობლებთან. ასევე ნიშნავს 'ნახვამდის'-საც." },
            { fr: "Ça va ?", ka: "როგორ ხარ?", tip: "ნიშნავს 'როგორ მიდის საქმეები?'. პასუხიც იგივეა: 'Ça va!' (კარგად)." },
            { fr: "Merci beaucoup", ka: "დიდი მადლობა", tip: "Beaucoup ნიშნავს 'ბევრს'. ფრანგები მადლობას ძალიან ხშირად იხდიან, არ დაგავიწყდეთ!" },
            { fr: "S'il vous plaît", ka: "თუ შეიძლება", tip: "თავაზიანი ფორმაა (თქვენობით). მეგობართან იტყვით: S'il te plaît." },
            { fr: "Enchanté", ka: "სასიამოვნოა", tip: "ამბობთ მხოლოდ პირველი გაცნობისას. მამაკაცები წერენ Enchanté, ქალები - Enchantée (გამოითქმის ერთნაირად)." },
            { fr: "Au revoir", ka: "ნახვამდის", tip: "სიტყვასიტყვით ნიშნავს: 'კვლავ ნახვამდე'. ყველაზე გავრცელებული დამშვიდობებაა." },
            { fr: "À bientôt", ka: "მალე შეხვედრამდე", tip: "გამოიყენება მაშინ, როცა ზუსტად არ იცით როდის, მაგრამ მალე შეხვდებით." }
        ];

        let currentIndex = 0;

        function updateDisplay() {
            if (currentIndex < vocabulary.length) {
                document.getElementById('fr-word').innerText = vocabulary[currentIndex].fr;
                document.getElementById('ka-word').innerText = vocabulary[currentIndex].ka;
                document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${vocabulary.length}`;
                document.getElementById('feedback').innerText = "";
            }
        }

        function showTip() {
            document.getElementById('tip-text').innerText = vocabulary[currentIndex].tip;
            document.getElementById('tipModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('tipModal').style.display = "none";
        }

        function playCurrent() {
            const utterance = new SpeechSynthesisUtterance(vocabulary[currentIndex].fr);
            utterance.lang = 'fr-FR';
            window.speechSynthesis.speak(utterance);
        }

        function startChallenge() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            
            recognition.onstart = () => document.getElementById('mic-btn').classList.add('recording');
            recognition.onresult = (event) => {
                const result = event.results[0][0].transcript.toLowerCase();
                const target = vocabulary[currentIndex].fr.toLowerCase().replace(/[?!.,]/g, "");
                if (result.includes(target)) {
                    document.getElementById('feedback').innerText = "✨ სწორია! ✨";
                    setTimeout(() => { currentIndex++; if(currentIndex < vocabulary.length) updateDisplay(); else alert('გაკვეთილი დასრულდა!'); }, 1200);
                } else {
                    document.getElementById('feedback').innerText = "❌ სცადე კიდევ ერთხელ";
                }
            };
            recognition.onend = () => document.getElementById('mic-btn').classList.remove('recording');
            recognition.start();
        }

        updateDisplay();
    </script>
</body>
</html>
