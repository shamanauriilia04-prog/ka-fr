<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="header">
            <a href="index.html" style="position:absolute; left:20px; text-decoration:none; color:var(--primary); font-size:1.5rem;">✕</a>
            <h2>Les Salutations</h2>
            <p style="color:#86868b; margin-top:5px;">გაკვეთილი 1: კონტაქტი</p>
        </div>

        <div class="word-grid" id="grid"></div>
        
        <a href="test1.html" id="test-trigger">🎯 ჩააბარე ტესტი</a>
    </div>

    <script>
        const words = [
            { fr: "Bonjour", ka: "გამარჯობა", type: "formal" },
            { fr: "Bonsoir", ka: "საღამო მშვიდობისა", type: "formal" },
            { fr: "Salut", ka: "სალამი", type: "informal" },
            { fr: "Coucou", ka: "ჰეი", type: "informal" },
            { fr: "Ça va ?", ka: "როგორ ხარ?", type: "informal" },
            { fr: "Merci", ka: "მადლობა", type: "neutral" },
            { fr: "De rien", ka: "არაფრის", type: "neutral" },
            { fr: "Au revoir", ka: "ნახვამდის", type: "formal" },
            { fr: "À bientôt", ka: "მალე შეხვედრამდე", type: "neutral" },
            { fr: "À demain", ka: "ხვალამდე", type: "neutral" },
            { fr: "Enchanté", ka: "სასიამოვნოა", type: "neutral" },
            { fr: "Pardon", ka: "უკაცრავად", type: "neutral" }
        ];

        let learned = new Set();

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = words.map((w, i) => `
                <div class="word-card" id="card-${i}">
                    <span class="tag ${w.type === 'formal' ? 'tag-formal' : 'tag-informal'}">${w.type}</span>
                    <span class="word-fr">${w.fr}</span>
                    <span class="word-ka">${w.ka}</span>
                    <div class="btn-group">
                        <button class="action-btn" onclick="say('${w.fr}', ${i})">🔊</button>
                        <button class="action-btn mic-btn" id="mic-${i}" onclick="listen('${w.fr}', ${i})">🎤</button>
                    </div>
                </div>
            `).join('');
        }

        function say(txt, idx) {
            const u = new SpeechSynthesisUtterance(txt);
            u.lang = 'fr-FR';
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
            updateProgress(idx);
        }

        function updateProgress(idx) {
            learned.add(idx);
            document.getElementById(`card-${idx}`).classList.add('learned');
            const percent = (learned.size / words.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            if(learned.size === words.length) document.getElementById('test-trigger').style.display = 'block';
        }

        function listen(target, idx) {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'fr-FR';
            const btn = document.getElementById(`mic-${idx}`);
            btn.classList.add('active');
            rec.start();
            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript.toLowerCase();
                if(speech.includes(target.toLowerCase().replace(/[?!]/g, ''))) {
                    updateProgress(idx);
                }
                btn.classList.remove('active');
            };
            rec.onerror = () => btn.classList.remove('active');
        }

        render();
    </script>
</body>
</html>
