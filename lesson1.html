<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>გაკვეთილი 1 - მისალმება</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <h2>L'art de saluer</h2>
            <p>კონტაქტის ხელოვნება</p>
        </div>

        <div class="lesson-content">
            <div id="word-list"></div>
        </div>
    </div>

    <script>
        const vocabulary = [
            { 
                fr: "Bonjour, Monsieur", 
                ka: "გამარჯობა, ბატონო", 
                type: "formal", 
                tip: "გამოიყენეთ დღისით ნებისმიერ უცხო მამაკაცთან. ფრანგულში 'Monsieur'-ის დამატება ზრდილობის ნიშანია." 
            },
            { 
                fr: "Salut !", 
                ka: "სალამი / პრივეტ", 
                type: "informal", 
                tip: "მხოლოდ მეგობრებთან. ასევე ნიშნავს 'ნახვამდის'-ს." 
            },
            { 
                fr: "Comment allez-vous ?", 
                ka: "როგორ ბრძანდებით?", 
                type: "formal", 
                tip: "თქვენობითი ფორმა. გამოიყენეთ VOUS (თქვენ)." 
            },
            { 
                fr: "Ça va ?", 
                ka: "როგორ ხარ? / ხომ მშვიდობაა?", 
                type: "informal", 
                tip: "ყველაზე პოპულარული ფრაზა მეგობრებში. პასუხიც იგივეა: 'Ça va !'." 
            },
            { 
                fr: "Enchanté", 
                ka: "სასიამოვნოა თქვენი გაცნობა", 
                type: "neutral", 
                tip: "ამბობთ პირველი გაცნობისას." 
            },
            { 
                fr: "Au revoir", 
                ka: "ნახვამდის", 
                type: "formal", 
                tip: "სტანდარტული დამშვიდობება ნებისმიერ სიტუაციაში." 
            },
            { 
                fr: "À bientôt", 
                ka: "მალე შეხვედრამდე", 
                type: "neutral", 
                tip: "როცა იცით, რომ ადამიანს მალე ისევ ნახავთ." 
            }
        ];

        function renderWords() {
            const list = document.getElementById('word-list');
            list.innerHTML = vocabulary.map((item, i) => `
                <div class="word-card">
                    <span class="tag ${item.type === 'formal' ? 'tag-formal' : 'tag-informal'}">${item.type}</span>
                    <span class="word-fr">${item.fr}</span>
                    <span class="word-ka">${item.ka}</span>
                    <span class="word-tip">${item.tip}</span>
                    
                    <div class="controls">
                        <button class="btn-circle" onclick="play('${item.fr}')">🔊</button>
                        <button class="btn-circle btn-mic" id="mic-${i}" onclick="record('${item.fr}', ${i})">🎤</button>
                    </div>
                </div>
            `).join('');
        }

        function play(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function record(target, idx) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("AI Voice არ არის მხარდაჭერილი");

            const rec = new SpeechRecognition();
            rec.lang = 'fr-FR';
            const btn = document.getElementById(`mic-${idx}`);
            
            btn.classList.add('active');
            rec.start();

            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript.toLowerCase();
                if (speech.includes(target.toLowerCase().replace(/[?!,.]/g, ''))) {
                    alert("ბრავო! ✅ სწორი გამოთქმაა.");
                } else {
                    alert("თქვენ თქვით: " + speech + ". სცადეთ უფრო მკაფიოდ.");
                }
                btn.classList.remove('active');
            };

            rec.onerror = () => btn.classList.remove('active');
        }

        renderWords();
    </script>
</body>
</html>
