<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>გაკვეთილი 1 - მისალმება</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header" style="padding: 20px;">
            <a href="index.html" style="color: white; text-decoration: none; float: left;">←</a>
            <h3>მისალმება</h3>
        </header>

        <div style="padding: 20px;">
            <h2>სწავლა</h2>
            <div class="lesson-card">
                <p><strong>Bonjour</strong> [ბონჟუღ] - გამარჯობა</p>
            </div>
            <div class="lesson-card">
                <p><strong>Salut</strong> [სალიუ] - პრივეტ / ჩაო</p>
            </div>
            <div class="lesson-card">
                <p><strong>Merci</strong> [მეღსი] - მადლობა</p>
            </div>

            <div class="quiz-section">
                <h3>პატარა ტესტი:</h3>
                <p>როგორ არის ფრანგულად "მადლობა"?</p>
                <button class="quiz-option" onclick="check(this, false)">A) Bonjour</button>
                <button class="quiz-option" onclick="check(this, true)">B) Merci</button>
                <button class="quiz-option" onclick="check(this, false)">C) Salut</button>
                <p id="feedback"></p>
            </div>
        </div>
    </div>

    <script>
        function check(btn, isCorrect) {
            const feedback = document.getElementById('feedback');
            if(isCorrect) {
                btn.style.background = "#d4edda";
                btn.style.borderColor = "#c3e6cb";
                feedback.innerHTML = "✅ სწორია! ყოჩაღ!";
                feedback.style.color = "green";
            } else {
                btn.style.background = "#f8d7da";
                btn.style.borderColor = "#f5c6cb";
                feedback.innerHTML = "❌ სცადე თავიდან.";
                feedback.style.color = "red";
            }
        }
    </script>
</body>
</html>
