<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ოჯახი და ადამიანები - Bonjour</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --family-color: #007aff; --bg-soft: #f2f7ff; }
        
        .verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .verb-card {
            background: #fff; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.05); border: 1px solid #e1e9f5;
            position: relative; text-align: center; transition: 0.2s;
        }
        .verb-card strong { display: block; color: var(--family-color); font-size: 1.2rem; margin-bottom: 5px; }
        .verb-card span { color: #636e72; font-size: 0.9rem; }
        
        .card-tools { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; }
        .tool-btn {
            background: var(--bg-soft); border: none; width: 28px; height: 28px;
            border-radius: 50%; font-size: 0.8rem; cursor: pointer; color: var(--family-color);
        }

        .category-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 0 20px;
            scrollbar-width: none;
        }
        .tab {
            padding: 10px 20px; background: white; border: 1px solid #ddd;
            border-radius: 15px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .tab.active { background: var(--family-color); color: white; border-color: var(--family-color); }

        .practice-zone {
            background: white; border-radius: 30px; padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 2px solid #e1e9f5;
        }
        .modern-input {
            width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 15px;
            font-size: 1.1rem; text-align: center; outline: none; box-sizing: border-box;
        }
        .modern-input:focus { border-color: var(--family-color); }
        
        .btn-main {
            flex: 1; padding: 15px; border-radius: 15px; border: none;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-listen { background: var(--family-color); color: white; }
        .btn-next { background: #1c1c1e; color: white; width: 100%; margin-top: 10px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 40% auto; padding: 25px; border-radius: 25px; width: 80%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="padding:15px; background: var(--family-color);">
            <a href="index.html" style="color:white; float:left; text-decoration:none; font-size:1.5rem;">←</a>
            <h2>ხალხი და ოჯახი</h2>
        </div>

        <div style="padding: 20px;">
            <div class="category-scroll">
                <div class="tab active" onclick="setCat('core')">ოჯახი</div>
                <div class="tab" onclick="setCat('extended')">ნათესავები</div>
                <div class="tab" onclick="setCat('status')">სტატუსი</div>
                <div class="tab" onclick="setCat('phrases')">ფრაზები</div>
            </div>

            <div class="verb-grid" id="dataGrid"></div>

            <div class="practice-zone">
                <span style="color: var(--family-color); font-weight: bold; font-size: 0.8rem;">პრაქტიკა</span>
                <p id="ka-phrase" style="font-size: 1.3rem; font-weight: bold; margin: 10px 0;">დედა</p>
                <div style="display:flex; gap:10px;">
                    <button class="btn-main btn-listen" onclick="speakTarget()">🔊 მოსმენა</button>
                    <button class="btn-main" style="background:#333; color:white;" onclick="listenVoice()">🎤 თქვი</button>
                </div>
                <input type="text" class="modern-input" id="write-input" placeholder="დაწერე ფრანგულად..." oninput="checkWriting()" style="margin-top:15px;">
                <div id="feedback" style="height:25px; margin-top:10px; font-weight:bold; text-align:center;"></div>
                <button class="btn-main btn-next" onclick="nextEx()">შემდეგი →</button>
            </div>
        </div>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color:var(--family-color)"></h3>
            <p id="modal-text" style="color:#636e72; line-height:1.5;"></p>
            <button onclick="closeModal()" style="background:var(--family-color); color:white; border:none; padding:12px; width:100%; border-radius:12px; margin-top:15px;">გავიგე</button>
        </div>
    </div>

    <script>
        const library = [
            // CORE FAMILY
            { fr: "La mère", ka: "დედა", cat: "core", tip: "უფრო თბილად: Maman (დედიკო)." },
            { fr: "Le père", ka: "მამა", cat: "core", tip: "უფრო თბილად: Papa (მამიკო)." },
            { fr: "Le fils", ka: "ვაჟიშვილი", cat: "core", tip: "ბოლო 's' იკითხება: [ფის]." },
            { fr: "La fille", ka: "ქალიშვილი", cat: "core", tip: "ასევე ნიშნავს 'გოგონას'. [ფიი]." },
            { fr: "Le frère", ka: "ძმა", cat: "core", tip: "[ფრერ]" },
            { fr: "La sœur", ka: "და", cat: "core", tip: "[სერ]" },
            { fr: "L'enfant", ka: "ბავშვი", cat: "core", tip: "გამოითქმის ცხვირისმიერად: [ანფან]." },
            // EXTENDED
            { fr: "Le grand-père", ka: "ბაბუა", cat: "extended", tip: "[გრან-პერ]" },
            { fr: "La grand-mère", ka: "ბებია", cat: "extended", tip: "[გრან-მერ]" },
            { fr: "L'oncle", ka: "ბიძა", cat: "extended", tip: "[ონკლ]" },
            { fr: "La tante", ka: "დეიდა/მამიდა", cat: "extended", tip: "[ტანტ]" },
            { fr: "Le cousin", ka: "ბიძაშვილი (მ)", cat: "extended", tip: "[კუზენ]" },
            // STATUS
            { fr: "L'ami", ka: "მეგობარი", cat: "status", tip: "ქალი მეგობარი: L'amie." },
            { fr: "Le mari", ka: "ქმარი", cat: "status", tip: "[მარი]" },
            { fr: "La femme", ka: "ცოლი / ქალი", cat: "status", tip: "გამოითქმის: [ფამ]." },
            { fr: "Célibataire", ka: "დასაოჯახებელი", cat: "status", tip: "ნიშნავს მარტოხელას." },
            // PHRASES
            { fr: "Ma famille", ka: "ჩემი ოჯახი", cat: "phrases", tip: "[მა ფამიი]" },
            { fr: "Je t'aime", ka: "მიყვარხარ", cat: "phrases", tip: "ყველაზე მნიშვნელოვანი ფრაზა!" },
            { fr: "C'est mon ami", ka: "ეს ჩემი მეგობარია", cat: "phrases", tip: "წარდგენისას გამოიყენება." }
        ];

        let activeCat = "core";
        let currentList = [];
        let curIdx = 0;

        function setCat(c) {
            activeCat = c;
            currentList = library.filter(i => i.cat === c);
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('onclick').includes(c)));
            curIdx = 0;
            renderGrid();
            updatePractice();
        }

        function renderGrid() {
            const grid = document.getElementById('dataGrid');
            grid.innerHTML = currentList.map((item, i) => `
                <div class="verb-card">
                    <div class="card-tools">
                        <button class="tool-btn" onclick="speak('${item.fr}')">🔊</button>
                        <button class="tool-btn" onclick="showTip(${i})">?</button>
                    </div>
                    <strong>${item.fr}</strong>
                    <span>${item.ka}</span>
                </div>
            `).join('');
        }

        function updatePractice() {
            document.getElementById('ka-phrase').innerText = currentList[curIdx].ka;
            document.getElementById('write-input').value = "";
            document.getElementById('feedback').innerText = "";
        }

        function checkWriting() {
            if(document.getElementById('write-input').value.toLowerCase().trim() === currentList[curIdx].fr.toLowerCase()) {
                document.getElementById('feedback').innerText = "✅ იდეალურია!";
                document.getElementById('feedback').style.color = "#2ecc71";
            }
        }

        function nextEx() {
            curIdx = (curIdx + 1) % currentList.length;
            updatePractice();
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            u.rate = 0.9;
            speechSynthesis.speak(u);
        }

        function speakTarget() { speak(currentList[curIdx].fr); }

        function showTip(i) {
            document.getElementById('modal-title').innerText = currentList[i].fr;
            document.getElementById('modal-text').innerText = currentList[i].tip;
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

        function listenVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'fr-FR';
            rec.onresult = (e) => {
                if(e.results[0][0].transcript.toLowerCase().includes(currentList[curIdx].fr.toLowerCase()))
                    document.getElementById('feedback').innerText = "🎤 ხმა სწორია!";
            };
            rec.start();
        }

        setCat('core');
    </script>
</body>
</html>
