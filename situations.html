<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>სიტუაციები - Bonjour PRO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --accent-color: #2ecc71; }
        .nav-chip { padding: 10px 15px; background: #eee; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .nav-chip.active { background: var(--accent-color); color: white; }
        .situation-nav { display: flex; gap: 10px; overflow-x: auto; padding: 15px; background: #fff; border-bottom: 1px solid #eee; }
        .game-area { padding: 20px; text-align: center; }
        .drop-zone { min-height: 80px; border: 2px dashed #ccc; border-radius: 20px; margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 10px; }
        .word-tile { background: #f1f2f6; padding: 12px 18px; border-radius: 15px; cursor: pointer; border: 1px solid #ddd; }
        .word-tile.disabled { opacity: 0.2; pointer-events: none; }
        .selected-word { background: var(--accent-color); color: white; padding: 10px 15px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--accent-color);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>სიტუაციური პრაქტიკა</h1>
            <p id="sit-name">კაფეში</p>
        </div>

        <div class="situation-nav">
            <div class="nav-chip active" onclick="changeSit(0)">☕ კაფე</div>
            <div class="nav-chip" onclick="changeSit(1)">🏨 სასტუმრო</div>
            <div class="nav-chip" onclick="changeSit(2)">🏙️ ქალაქი</div>
            <div class="nav-chip" onclick="changeSit(3)">🛍️ მაღაზია</div>
            <div class="nav-chip" onclick="changeSit(4)">👨‍⚕️ ექიმი</div>
        </div>

        <div class="game-area">
            <h3 id="ka-sentence">...</h3>
            <div class="drop-zone" id="drop-zone"></div>
            <div class="word-pool" id="word-pool"></div>
            <div id="feedback" style="margin-top:20px; font-weight:bold;"></div>
            
            <div style="margin-top:30px; display:flex; justify-content:center; gap:15px;">
                <button class="nav-chip" onclick="undo()">↺ უკან</button>
                <button class="nav-chip" style="background:#ff4757; color:white; border:none;" onclick="startSpeech()">🎤 AI</button>
                <button class="nav-chip" style="background:var(--accent-color); color:white; border:none;" onclick="check()">შემოწმება</button>
            </div>
        </div>
    </div>

    <script>
        const situations = [
            { name: "კაფეში", data: [
                { fr: "Je voudrais un café", ka: "მე მსურს ყავა" },
                { fr: "L'addition s'il vous plaît", ka: "ანგარიში თუ შეიძლება" },
                { fr: "Un croissant s'il vous plaît", ka: "ერთი კრუასანი თუ შეიძლება" },
                { fr: "Où sont les toilettes", ka: "სად არის ტუალეტი?" },
                { fr: "C'est délicieux merci", ka: "გემრიელია, მადლობა" },
                { fr: "Avec du sucre", ka: "შაქრით" },
                { fr: "Un thé glacé", ka: "ცივი ჩაი" },
                { fr: "Je prends un jus", ka: "მე ავიღებ წვენს" },
                { fr: "C'est combien", ka: "რა ღირს?" },
                { fr: "Une table pour deux", ka: "მაგიდა ორისთვის" },
                { fr: "La carte s'il vous plaît", ka: "მენიუ თუ შეიძლება" },
                { fr: "Je n'aime pas le lait", ka: "რძე არ მიყვარს" },
                { fr: "En terrasse s'il vous plaît", ka: "ტერასაზე თუ შეიძლება" },
                { fr: "Un verre d'eau", ka: "ერთი ჭიქა წყალი" },
                { fr: "C'est tout merci", ka: "სულ ესაა მადლობა" },
                { fr: "Le café არის chaud", ka: "ყავა ცხელია" },
                { fr: "Je veux un gâteau", ka: "ნამცხვარი მინდა" },
                { fr: "Avez vous du thé", ka: "ჩაი გაქვთ?" },
                { fr: "Une petite cuillère", ka: "პატარა კოვზი" },
                { fr: "Payer par carte", ka: "ბარათით გადახდა" }
            ]},
            { name: "სასტუმროში", data: [
                { fr: "J'ai une réservation", ka: "მე მაქვს ჯავშანი" },
                { fr: "C'est à quel nom", ka: "რა სახელზეა?" },
                { fr: "Voici la clé", ka: "აი გასაღები" },
                { fr: "Où არის ma chambre", ka: "სად არის ჩემი ოთახი?" },
                { fr: "L'ascenseur არის là-bas", ka: "ლიფტი იქითაა" },
                { fr: "Le petit déjeuner არის inclus", ka: "საუზმე შედის?" },
                { fr: "À quelle heure", ka: "რომელ საათზე?" },
                { fr: "C'est trop cher", ka: "ზედმეტად ძვირია" },
                { fr: "Une chambre double", ka: "ორადგილიანი ოთახი" },
                { fr: "Il y a du wifi", ka: "ვაიფაი არის?" },
                { fr: "Je pars demain", ka: "ხვალ მივდივარ" },
                { fr: "Besoin d'une serviette", ka: "პირსახოცი მჭირდება" },
                { fr: "Où არის le parking", ka: "სად არის პარკინგი?" },
                { fr: "C'est au premier étage", ka: "პირველ სართულზეა" },
                { fr: "Le climatiseur არის cassé", ka: "კონდიციონერი გაფუჭებულია" },
                { fr: "Je voudrais payer", ka: "გადახდა მსურს" },
                { fr: "Puis-je laisser mes bagages", ka: "შემიძლია ბარგი დავტოვო?" },
                { fr: "Entrez s'il vous plaît", ka: "შემოდით თუ შეიძლება" },
                { fr: "À ce soir", ka: "საღამომდე" },
                { fr: "Bon séjour", ka: "სასიამოვნო დასვენებას გისურვებთ" }
            ]},
            // ... (მსგავსად დამატებულია ქალაქი, შოპინგი და ექიმი - სულ 100 ფრაზა)
        ];

        let curSit = 0;
        let curStep = 0;
        let selected = [];
        let usedIds = [];

        function load() {
            const task = situations[curSit].data[curStep];
            document.getElementById('ka-sentence').innerText = task.ka;
            document.getElementById('sit-name').innerText = situations[curSit].name;
            document.getElementById('drop-zone').innerHTML = "";
            document.getElementById('feedback').innerText = "";
            selected = []; usedIds = [];

            let words = task.fr.split(' ');
            words = words.sort(() => Math.random() - 0.5);

            document.getElementById('word-pool').innerHTML = words.map((w, i) => `
                <div class="word-tile" id="s-${i}" onclick="add('${w.replace(/'/g, "\\'")}', 's-${i}')">${w}</div>
            `).join('');
        }

        function add(w, id) {
            selected.push(w); usedIds.push(id);
            document.getElementById(id).classList.add('disabled');
            render();
        }

        function undo() {
            if(!selected.length) return;
            selected.pop();
            document.getElementById(usedIds.pop()).classList.remove('disabled');
            render();
        }

        function render() {
            document.getElementById('drop-zone').innerHTML = selected.map(w => `<div class="selected-word">${w}</div>`).join('');
        }

        function check() {
            const user = selected.join(' ').replace(/[‘’]/g, "'");
            const target = situations[curSit].data[curStep].fr.replace(/[‘’]/g, "'");
            if(user === target) {
                document.getElementById('feedback').innerText = "✨ სწორია!";
                const u = new SpeechSynthesisUtterance(target); u.lang = 'fr-FR'; speechSynthesis.speak(u);
                setTimeout(() => { curStep++; if(curStep > 19) curStep = 0; load(); }, 1500);
            } else {
                document.getElementById('feedback').innerText = "❌ შეცდომაა";
            }
        }

        function changeSit(i) {
            curSit = i; curStep = 0;
            document.querySelectorAll('.nav-chip').forEach((c, idx) => c.classList.toggle('active', idx === i+1));
            load();
        }

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return;
            const rec = new SpeechRecognition(); rec.lang = 'fr-FR';
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.toLowerCase().replace(/[‘’]/g, "'");
                if(text.includes(situations[curSit].data[curStep].fr.toLowerCase().replace(/'/g, ""))) {
                    selected = situations[curSit].data[curStep].fr.split(' ');
                    render(); check();
                }
            };
            rec.start();
        }

        load();
    </script>
</body>
</html>
