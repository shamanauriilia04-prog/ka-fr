<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>მისალმება - Progress Mode</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --accent: #007aff; --success: #2ecc71; }
        
        /* პროგრესის ბარი */
        .progress-container {
            width: 100%; height: 8px; background: #eee;
            position: sticky; top: 0; z-index: 100;
        }
        #progress-bar {
            width: 0%; height: 100%; background: var(--success);
            transition: 0.4s;
        }

        .verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
        
        .verb-card {
            background: #fff; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid transparent;
            position: relative; text-align: center; transition: 0.3s;
        }
        
        /* სტილი როცა სიტყვა ათვისებულია */
        .verb-card.learned {
            border-color: var(--success);
            background: #f0fff4;
        }
        
        .verb-card strong { display: block; color: var(--accent); font-size: 1.1rem; }

        .card-tools { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; }
        .tool-btn {
            background: #f0f0f0; border: none; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer; font-size: 0.9rem;
        }

        /* ტესტის ღილაკი */
        #test-btn {
            display: none; margin: 20px; padding: 15px;
            background: var(--success); color: white; border: none;
            border-radius: 15px; font-weight: bold; width: calc(100% - 40px);
            cursor: pointer; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 30% auto; padding: 30px; border-radius: 25px; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div class="progress-container"><div id="progress-bar"></div></div>

    <div class="app-container">
        <div class="header" style="padding:15px; background: var(--accent); color:white;">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h2 style="margin:0">მისალმება</h2>
        </div>

        <div id="dataGrid" class="verb-grid"></div>

        <button id="test-btn" onclick="startTest()">🏆 ჩააბარე ტესტი (100%)</button>

        <div id="infoModal" class="modal">
            <div class="modal-content">
                <h3 id="modal-title"></h3>
                <p id="modal-text"></p>
                <button onclick="closeModal()" style="background:var(--accent); color:white; border:none; padding:12px; width:100%; border-radius:12px;">გავიგე</button>
            </div>
        </div>
    </div>

    <script>
        const lessonId = "hello_lesson";
        const library = [
            { fr: "Bonjour", ka: "გამარჯობა", tip: "გამოიყენება დღისით მზის ჩასვლამდე." },
            { fr: "Salut", ka: "გამარჯობა/ნახვამდის", tip: "მეგობრული, შინაურული ფორმა." },
            { fr: "Bonsoir", ka: "საღამო მშვიდობისა", tip: "გამოიყენება საღამოს 6 საათის შემდეგ." },
            { fr: "Ça va ?", ka: "როგორ ხარ?", tip: "ყველაზე პოპულარული კითხვა ფრანგულში." },
            { fr: "Merci", ka: "გმადლობთ", tip: "მადლობის გადახდის სტანდარტული ფორმა." },
            { fr: "De rien", ka: "არაფრის", tip: "პასუხი მადლობაზე." },
            { fr: "Au revoir", ka: "ნახვამდის", tip: "ოფიციალური დამშვიდობება." },
            { fr: "S'il vous plaît", ka: "თუ შეიძლება", tip: "თავაზიანი თხოვნა (თქვენობით)." }
        ];

        // მეხსიერებიდან წამოღება
        let learnedWords = JSON.parse(localStorage.getItem(lessonId)) || [];

        function renderGrid() {
            const grid = document.getElementById('dataGrid');
            grid.innerHTML = library.map((item, i) => `
                <div class="verb-card ${learnedWords.includes(item.fr) ? 'learned' : ''}" id="card-${i}">
                    <div class="card-tools">
                        <button class="tool-btn" onclick="handleListen('${item.fr}', ${i})">🔊</button>
                        <button class="tool-btn" onclick="showTip(${i})">?</button>
                    </div>
                    <strong>${item.fr}</strong>
                    <span>${item.ka}</span>
                </div>
            `).join('');
            updateProgress();
        }

        function handleListen(text, index) {
            speak(text);
            if (!learnedWords.includes(text)) {
                learnedWords.push(text);
                localStorage.setItem(lessonId, JSON.stringify(learnedWords));
                document.getElementById(`card-${index}`).classList.add('learned');
                updateProgress();
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // წინა ხმის გათიშვა
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.8; // ოდნავ ნელი, რომ კარგად გაირჩეს
            u.pitch = 1.1; // ქალის უფრო სასიამოვნო ტემბრისთვის
            
            // ვეძებთ საუკეთესო ფრანგულ ხმას
            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.startsWith('fr') && v.name.includes('Google'));
            if (frVoice) u.voice = frVoice;

            window.speechSynthesis.speak(u);
        }

        function updateProgress() {
            const percent = (learnedWords.length / library.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            
            // თუ ყველაფერი ისწავლა, გამოვაჩინოთ ტესტის ღილაკი
            if (percent === 100) {
                document.getElementById('test-btn').style.display = 'block';
            }
            
            // მთავარი გვერდისთვის პროცენტის შენახვა
            localStorage.setItem(lessonId + "_percent", Math.round(percent));
        }

        function startTest() {
            alert("გილოცავთ! თქვენ წარმატებით გაიარეთ მასალა. გაკვეთილი ჩაბარებულია!");
            localStorage.setItem(lessonId + "_completed", "true");
            window.location.href = "index.html";
        }

        function showTip(i) {
            document.getElementById('modal-title').innerText = library[i].fr;
            document.getElementById('modal-text').innerText = library[i].tip;
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

        // ხმების ჩატვირთვა
        window.speechSynthesis.onvoiceschanged = () => renderGrid();
        renderGrid();
    </script>
</body>
</html>
