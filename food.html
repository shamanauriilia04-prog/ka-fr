<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>საჭმელი - Progress Mode</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --accent: #f39c12; --success: #2ecc71; }
        .progress-container { width: 100%; height: 10px; background: #eee; position: sticky; top: 0; z-index: 100; }
        #progress-bar { width: 0%; height: 100%; background: var(--success); transition: 0.4s; }
        
        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 15px; scrollbar-width: none; background: #fff; border-bottom: 1px solid #eee; }
        .tab { padding: 10px 20px; background: #f0f0f0; border-radius: 15px; white-space: nowrap; cursor: pointer; font-weight: bold; border: none; font-size: 14px; }
        .tab.active { background: var(--accent); color: white; }

        .verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .verb-card {
            background: #fff; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid transparent;
            position: relative; text-align: center; transition: 0.3s;
        }
        .verb-card.learned { border-color: var(--success); background: #f0fff4; }
        .verb-card strong { display: block; color: var(--accent); font-size: 1rem; margin-bottom: 3px; }
        
        .card-tools { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; }
        .tool-btn { background: #f0f0f0; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
        
        #test-btn {
            display: none; margin: 20px; padding: 18px; background: var(--success); color: white; 
            border: none; border-radius: 15px; font-weight: bold; width: calc(100% - 40px); cursor: pointer;
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 30% auto; padding: 30px; border-radius: 25px; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div class="progress-container"><div id="progress-bar"></div></div>
    
    <div class="app-container">
        <div class="header" style="padding:15px; background: var(--accent); color:white;">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h2 style="margin:0">LA NOURRITURE</h2>
        </div>

        <div class="category-scroll">
            <button class="tab active" onclick="setCat('basic')">პროდუქტები</button>
            <button class="tab" onclick="setCat('fruits')">ხილი/ბოსტნეული</button>
            <button class="tab" onclick="setCat('drinks')">სასმელები</button>
            <button class="tab" onclick="setCat('phrases')">რესტორანი</button>
        </div>

        <div id="dataGrid" class="verb-grid"></div>
        <button id="test-btn" onclick="startTest()">🏆 ჩააბარე ტესტი (100%)</button>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <button onclick="closeModal()" style="background:var(--accent); color:white; border:none; padding:12px; width:100%; border-radius:12px;">გავიგე</button>
        </div>
    </div>

    <script>
        const lessonId = "food_lesson";
        const library = [
            { fr: "Le pain", ka: "პური", cat: "basic", tip: "[ლე პენ]" },
            { fr: "Le fromage", ka: "ყველი", cat: "basic", tip: "[ლე ფრომაჟ]" },
            { fr: "Le sucre", ka: "შაქარი", cat: "basic", tip: "[ლე სუკრ]" },
            { fr: "La viande", ka: "ხორცი", cat: "basic", tip: "[ლა ვიანდ]" },
            { fr: "La pomme", ka: "ვაშლი", cat: "fruits", tip: "[ლა პომ]" },
            { fr: "La banane", ka: "ბანანი", cat: "fruits", tip: "[ლა ბანან]" },
            { fr: "La tomate", ka: "პომიდორი", cat: "fruits", tip: "[ლა ტომატ]" },
            { fr: "L'eau", ka: "წყალი", cat: "drinks", tip: "[ლო]" },
            { fr: "Le café", ka: "ყავა", cat: "drinks", tip: "[ლე კაფე]" },
            { fr: "Le vin", ka: "ღვინო", cat: "drinks", tip: "[ლე ვენ]" },
            { fr: "Le menu", ka: "მენიუ", cat: "phrases", tip: "[ლე მენიუ]" },
            { fr: "L'addition", ka: "ანგარიში", cat: "phrases", tip: "[ლადისიონ]" },
            { fr: "Je voudrais", ka: "მე მსურს", cat: "phrases", tip: "[ჟე ვუდრე]" }
        ];

        let learnedWords = JSON.parse(localStorage.getItem(lessonId)) || [];
        let activeCat = "basic";

        function setCat(cat) {
            activeCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('onclick').includes(cat)));
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('dataGrid');
            const filtered = library.filter(n => n.cat === activeCat);
            grid.innerHTML = filtered.map((item, i) => `
                <div class="verb-card ${learnedWords.includes(item.fr) ? 'learned' : ''}" id="card-${item.fr.replace(/[' ]/g, '-')}">
                    <div class="card-tools">
                        <button class="tool-btn" onclick="handleListen('${item.fr}')">🔊</button>
                        <button class="tool-btn" onclick="showTip('${item.fr}')">?</button>
                    </div>
                    <strong>${item.fr}</strong>
                    <span>${item.ka}</span>
                </div>
            `).join('');
            updateProgress();
        }

        function handleListen(text) {
            speak(text);
            if (!learnedWords.includes(text)) {
                learnedWords.push(text);
                localStorage.setItem(lessonId, JSON.stringify(learnedWords));
                const card = document.getElementById(`card-${text.replace(/[' ]/g, '-')}`);
                if(card) card.classList.add('learned');
                updateProgress();
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.8;
            const voices = window.speechSynthesis.getVoices();
            const frVoice = voices.find(v => v.lang.startsWith('fr') && v.name.includes('Google'));
            if (frVoice) u.voice = frVoice;
            window.speechSynthesis.speak(u);
        }

        function updateProgress() {
            const percent = (learnedWords.length / library.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
            if (percent >= 100) document.getElementById('test-btn').style.display = 'block';
            localStorage.setItem(lessonId + "_percent", Math.round(percent));
        }

        function startTest() {
            alert("Bon Appétit! კვების თემა წარმატებით დასრულდა.");
            localStorage.setItem(lessonId + "_completed", "true");
            window.location.href = "index.html";
        }

        function showTip(fr) {
            const item = library.find(n => n.fr === fr);
            document.getElementById('modal-title').innerText = item.fr;
            document.getElementById('modal-text').innerText = item.tip;
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
        window.speechSynthesis.onvoiceschanged = () => renderGrid();
        renderGrid();
    </script>
</body>
</html>
