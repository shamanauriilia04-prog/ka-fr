<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>დიალოგები - Bonjour</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --dialogue-color: #2ecc71; }
        
        /* ანიმაციები */
        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding: 10px; 
            min-height: 400px;
        }
        
        .bubble {
            max-width: 85%; 
            padding: 15px; 
            border-radius: 22px;
            position: relative; 
            font-size: 0.95rem; 
            line-height: 1.4;
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInBubble 0.5s ease forwards;
        }

        .bubble:active { transform: scale(0.95); }
        
        .bubble.left {
            align-self: flex-start; 
            background: #f0f2f5;
            border-bottom-left-radius: 4px; 
            color: #333;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }
        
        .bubble.right {
            align-self: flex-end; 
            background: var(--blue);
            border-bottom-right-radius: 4px; 
            color: white;
            text-align: right;
            box-shadow: -2px 2px 10px rgba(0,35,149,0.1);
        }

        .translation { display: block; font-size: 0.75rem; margin-top: 5px; opacity: 0.7; font-style: italic; }
        .speaker-name { font-weight: bold; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px; display: block; opacity: 0.6; }

        .dialogue-selector {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 20px;
            scrollbar-width: none;
        }
        .dialogue-selector::-webkit-scrollbar { display: none; }

        .topic-btn {
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--dialogue-color);
            background: white;
            color: var(--dialogue-color);
            font-weight: bold;
            cursor: pointer;
        }
        .topic-btn.active {
            background: var(--dialogue-color);
            color: white;
        }

        .audio-icon { font-size: 1.2rem; margin-left: 10px; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--dialogue-color);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>ფრანგული დიალოგები</h1>
            <p>მოუსმინე და გაიმეორე 🎧</p>
        </div>

        <div class="dialogue-selector" id="topic-list"></div>

        <div class="lesson-list">
            <div class="chat-container" id="chat-box"></div>
            
            <div style="text-align: center; margin-top: 20px; padding: 20px; background: #fdfdfd; border-radius: 20px; border: 1px dashed #ccc;">
                <p id="hint-text" style="font-size: 0.85rem; color: #777;">აირჩიე თემა და დააწკაპუნე ბუშტებს ხმისთვის</p>
            </div>
        </div>
    </div>

    <script>
        const dialogues = [
            {
                id: 0,
                topic: "👋 გაცნობა",
                content: [
                    { side: "left", name: "Pierre", fr: "Salut ! Comment ça va ?", ka: "სალამი! როგორ ხარ?" },
                    { side: "right", name: "Marie", fr: "Ça va bien, merci. Et toi ?", ka: "კარგად, გმადლობ. შენ?" },
                    { side: "left", name: "Pierre", fr: "Moi aussi. Tu t'appelles comment ?", ka: "მეც ასევე. რა გქვია?" },
                    { side: "right", name: "Marie", fr: "Je m'appelle Marie. Enchantée !", ka: "მე მარი მქვია. სასიამოვნოა!" }
                ]
            },
            {
                id: 1,
                topic: "☕ კაფეში",
                content: [
                    { side: "left", name: "Serveur", fr: "Bonjour, vous désirez ?", ka: "გამარჯობა, რას ინებებთ?" },
                    { side: "right", name: "Luc", fr: "Un croissant et un café, s'il vous plaît.", ka: "ერთი კრუასანი და ყავა, თუ შეიძლება." },
                    { side: "left", name: "Serveur", fr: "C'est tout ?", ka: "სულ ეს არის?" },
                    { side: "right", name: "Luc", fr: "Oui, c'est tout. Merci.", ka: "დიახ, სულ ესაა. მადლობა." }
                ]
            },
            {
                id: 2,
                topic: "🛍️ მაღაზიაში",
                content: [
                    { side: "left", name: "Vendeur", fr: "Bonjour ! Je peux vous aider ?", ka: "გამარჯობა! რით შემიძლია დაგეხმაროთ?" },
                    { side: "right", name: "Emma", fr: "Oui, je cherche une robe rouge.", ka: "დიახ, წითელ კაბას ვეძებ." },
                    { side: "left", name: "Vendeur", fr: "D'accord, quelle est votre taille ?", ka: "გასაგებია, რა ზომა გაქვთ?" },
                    { side: "right", name: "Emma", fr: "Je fais du 38.", ka: "38 ზომა მაქვს." }
                ]
            },
            {
                id: 3,
                topic: "🚕 ტაქსიში",
                content: [
                    { side: "right", name: "Passager", fr: "Bonjour ! À la tour Eiffel, s'il vous plaît.", ka: "გამარჯობა! ეიფელის კოშკთან, თუ შეიძლება." },
                    { side: "left", name: "Chauffeur", fr: "C'est parti ! Vous êtes touriste ?", ka: "წავედით! ტურისტი ხართ?" },
                    { side: "right", name: "Passager", fr: "Oui, j'adore Paris !", ka: "დიახ, პარიზი ძალიან მიყვარს!" },
                    { side: "left", name: "Chauffeur", fr: "C'est 15 euros, monsieur.", ka: "15 ევრო იქნება, ბატონო." }
                ]
            }
        ];

        let currentId = 0;

        function initTopics() {
            const list = document.getElementById('topic-list');
            list.innerHTML = dialogues.map(d => `
                <button class="topic-btn ${d.id === currentId ? 'active' : ''}" 
                        onclick="loadDialogue(${d.id})" id="btn-${d.id}">
                    ${d.topic}
                </button>
            `).join('');
        }

        function loadDialogue(id) {
            // ღილაკების სტილის შეცვლა
            document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');
            
            currentId = id;
            const container = document.getElementById('chat-box');
            container.innerHTML = ""; // გასუფთავება ანიმაციისთვის

            dialogues[id].content.forEach((msg, index) => {
                setTimeout(() => {
                    const bubble = document.createElement('div');
                    bubble.className = `bubble ${msg.side}`;
                    bubble.onclick = () => speak(msg.fr);
                    bubble.innerHTML = `
                        <span class="speaker-name">${msg.name}</span>
                        <strong>${msg.fr} <span class="audio-icon">🔊</span></strong>
                        <span class="translation">${msg.ka}</span>
                    `;
                    container.appendChild(bubble);
                }, index * 400); // ბუშტები გამოჩნდება სათითაოდ
            });
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.85; // ოდნავ ნელი ბუნებრივი ჟღერადობისთვის
            speechSynthesis.speak(utterance);
        }

        initTopics();
        loadDialogue(0);
    </script>
</body>
</html>
