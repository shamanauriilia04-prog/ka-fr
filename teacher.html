<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professeur AI - Premium Tutor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --ai-primary: #002395;
            --ai-accent: #ed2939;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }

        .teacher-container {
            max-width: 500px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* მასწავლებლის ვიზუალური ბლოკი */
        .teacher-avatar-wrapper {
            position: relative; margin-top: 30px;
        }

        .avatar-circle {
            width: 140px; height: 140px; background: white;
            border-radius: 50%; border: 4px solid var(--ai-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 70px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2; position: relative;
        }

        /* ლაპარაკის ანიმაცია (ტალღები) */
        .pulse-rings {
            position: absolute; top: 0; left: 0; width: 140px; height: 140px;
            border-radius: 50%; background: var(--ai-primary);
            opacity: 0; z-index: 1;
        }

        .speaking .pulse-rings {
            animation: pulse-ring 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* საუბრის ბუშტი */
        .ai-speech-bubble {
            background: var(--glass); padding: 25px; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: 30px 0;
            width: 100%; position: relative; text-align: center;
            border: 1px solid rgba(0,35,149,0.1);
        }

        .ai-speech-bubble::before {
            content: ''; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); border-left: 10px solid transparent;
            border-right: 10px solid transparent; border-bottom: 10px solid white;
        }

        .user-echo {
            font-size: 0.9rem; color: var(--ai-primary); font-weight: 600;
            margin-bottom: 10px; min-height: 20px;
        }

        /* კონტროლის ღილაკი */
        .mic-section {
            position: fixed; bottom: 40px; text-align: center; width: 100%; left: 0;
        }

        .master-mic-btn {
            width: 85px; height: 85px; border-radius: 50%;
            background: var(--ai-accent); border: none; color: white;
            font-size: 32px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(237, 41, 57, 0.4);
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
        }

        .master-mic-btn.active {
            background: #2ecc71; transform: scale(1.1);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.5);
        }

        /* AI-ს სტატუსი */
        .ai-mood-tag {
            background: #dfe6e9; padding: 5px 15px; border-radius: 20px;
            font-size: 0.75rem; font-weight: bold; margin-bottom: 10px;
            color: #636e72; text-transform: uppercase;
        }

        .correction-card {
            background: #fff5f5; border-left: 4px solid var(--ai-accent);
            padding: 10px; border-radius: 10px; margin-top: 15px;
            font-size: 0.85rem; display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--ai-primary);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>Professeur AI</h1>
        </div>

        <div class="teacher-container">
            <div class="ai-mood-tag" id="ai-mood">მოსმენის რეჟიმი</div>
            
            <div class="teacher-avatar-wrapper" id="avatar-container">
                <div class="pulse-rings"></div>
                <div class="avatar-circle" id="ai-emoji">👨‍🏫</div>
            </div>

            <div class="ai-speech-bubble animate__animated animate__fadeIn">
                <div class="user-echo" id="user-text">...</div>
                <div id="ai-response" style="font-size: 1.1rem; line-height: 1.5;">
                    Bonjour ! მე შენი მასწავლებელი ვარ. მითხარი რამე ფრანგულად, რომ დავიწყოთ გაკვეთილი.
                </div>
                
                <div id="correction-box" class="correction-card">
                    💡 <b>რჩევა:</b> <span id="correction-text"></span>
                </div>
            </div>
        </div>

        <div class="mic-section">
            <button class="master-mic-btn" id="mic-trigger" onclick="toggleListening()">
                🎤
            </button>
            <p style="margin-top:10px; color:#636e72; font-size:0.8rem;">დააჭირე და ისაუბრე</p>
        </div>
    </div>

    <script>
        const aiResponse = document.getElementById('ai-response');
        const aiEmoji = document.getElementById('ai-emoji');
        const userText = document.getElementById('user-text');
        const avatarCont = document.getElementById('avatar-container');
        const correctionBox = document.getElementById('correction-box');
        const correctionText = document.getElementById('correction-text');

        // AI-ს გრამატიკული და ლოგიკური ბაზა
        const rules = [
            { wrong: "je est", right: "je suis", tip: "ზმნა 'être' პირველ პირში არის 'suis'." },
            { wrong: "tu suis", right: "tu es", tip: "'Tu'-სთან გამოიყენება 'es'." },
            { wrong: "il suis", right: "il est", tip: "'Il/Elle'-სთან გამოიყენება 'est'." },
            { wrong: "je ai", right: "j'ai", tip: "ფრანგულში 'je' და 'ai' ერთდება: j'ai." }
        ];

        const chatLogic = {
            "bonjour": "Bonjour ! Comment allez-vous ? (გამარჯობა! როგორ ბრძანდებით?)",
            "ça va": "Ça va très bien, merci ! Et vous ? (ძალიან კარგად, გმადლობთ! თქვენ?)",
            "merci": "Je vous en prie ! (არაფრის, ჩემო კარგო!)",
            "au revoir": "Au revoir ! À bientôt ! (ნახვამდის! მალე შეხვედრამდე!)",
            "je m'appelle": "C'est un enchantement ! Vous parlez bien. (სასიამოვნოა! კარგად საუბრობთ.)"
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'fr-FR';

        function toggleListening() {
            try {
                rec.start();
                document.getElementById('mic-trigger').classList.add('active');
                document.getElementById('ai-mood').innerText = "გისმენთ ყურადღებით...";
            } catch(e) { console.log("უკვე ჩართულია"); }
        }

        rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript.toLowerCase();
            userText.innerText = "თქვენ: " + transcript;
            processAI(transcript);
        };

        rec.onend = () => {
            document.getElementById('mic-trigger').classList.remove('active');
            document.getElementById('ai-mood').innerText = "დააჭირე საუბრისთვის";
        };

        function processAI(text) {
            let finalResponse = "C'est intéressant ! Dites-en plus. (საინტერესოა, განაგრძეთ...)";
            let hasError = false;

            // 1. გრამატიკის შემოწმება
            correctionBox.style.display = "none";
            rules.forEach(rule => {
                if (text.includes(rule.wrong)) {
                    finalResponse = `Attention ! არ დაიბნეთ. უნდა გეთქვათ "${rule.right}".`;
                    correctionText.innerText = rule.tip;
                    correctionBox.style.display = "block";
                    hasError = true;
                    aiEmoji.innerText = "👨‍🏫";
                }
            });

            // 2. თუ გრამატიკა სწორია, ვპასუხობთ შინაარსობრივად
            if (!hasError) {
                for (let key in chatLogic) {
                    if (text.includes(key)) {
                        finalResponse = chatLogic[key];
                        aiEmoji.innerText = "😊";
                        break;
                    }
                }
            }

            // 3. ვიზუალური ეფექტები
            aiResponse.innerText = finalResponse;
            avatarCont.classList.add('speaking');
            speak(finalResponse);
            
            setTimeout(() => {
                avatarCont.classList.remove('speaking');
            }, 3000);
        }

        function speak(msg) {
            const u = new SpeechSynthesisUtterance(msg);
            u.lang = 'fr-FR';
            u.pitch = 1;
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
