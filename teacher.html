<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professeur AI - Live Chat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --ai-blue: #002395; --user-bg: #e9ecef; }
        body { background: #f4f7f6; overflow-x: hidden; }

        /* ავატარის ბლოკი */
        .avatar-section {
            padding: 30px 0; text-align: center; background: white;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .ai-character {
            width: 120px; height: 120px; border-radius: 50%;
            background: #eee; margin: 0 auto; overflow: hidden;
            border: 4px solid var(--ai-blue); position: relative;
        }
        .ai-character img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* ლაპარაკის ანიმაცია */
        .talking { animation: mouthMove 0.4s infinite alternate; }
        @keyframes mouthMove {
            from { transform: scale(1); } to { transform: scale(1.05); }
        }

        /* ჩეთის არე */
        .chat-container {
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            height: calc(100vh - 350px); overflow-y: auto; scroll-behavior: smooth;
        }
        .message {
            max-width: 80%; padding: 12px 18px; border-radius: 20px;
            font-size: 0.95rem; line-height: 1.4; animation: fadeInUp 0.3s;
        }
        .ai-msg { background: var(--ai-blue); color: white; align-self: flex-start; border-bottom-left-radius: 5px; }
        .user-msg { background: var(--user-bg); color: #333; align-self: flex-end; border-bottom-right-radius: 5px; }

        /* მართვის პანელი */
        .input-area {
            position: fixed; bottom: 0; width: 100%; padding: 20px;
            background: white; display: flex; justify-content: center; gap: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }
        .mic-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: #ed2939; color: white; font-size: 28px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(237, 41, 57, 0.3); transition: 0.3s;
        }
        .mic-btn.active { background: #2ecc71; transform: scale(1.1); animation: pulse 1s infinite; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.4); } 100% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--ai-blue);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>Professeur AI</h1>
        </div>

        <div class="avatar-section">
            <div class="ai-character" id="ai-avatar">
                <img src="https://cdn-icons-png.flaticon.com/512/1995/1995574.png" id="avatar-img" alt="Teacher">
            </div>
            <p id="status" style="margin-top:10px; color:#888; font-size:0.8rem;">მზად ვარ გისმინო</p>
        </div>

        <div class="chat-container" id="chat-box">
            <div class="message ai-msg">Bonjour ! მე შენი მასწავლებელი ვარ. დააჭირე მიკროფონს და მითხარი რამე ფრანგულად.</div>
        </div>

        <div class="input-area">
            <button class="mic-btn" id="mic-btn" onclick="startRecognition()">🎤</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const avatarImg = document.getElementById('avatar-img');
        const micBtn = document.getElementById('mic-btn');

        // AI ლოგიკა და ცოდნა
        const responses = {
            "bonjour": "Bonjour ! Comment ça va aujourd'hui ?",
            "ça va": "Très bien ! Qu'est-ce que vous voulez apprendre ?",
            "merci": "De rien, mon ami !",
            "je suis": "C'est bien ! Continuez à pratiquer.",
            "comment": "C'est une bonne question !"
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'fr-FR';

        function startRecognition() {
            rec.start();
            micBtn.classList.add('active');
            document.getElementById('status').innerText = "გისმენთ...";
        }

        rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript.toLowerCase();
            addMessage(transcript, 'user');
            processAI(transcript);
        };

        rec.onend = () => {
            micBtn.classList.remove('active');
            document.getElementById('status').innerText = "დააჭირე და ისაუბრე";
        };

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'ai' ? 'ai-msg' : 'user-msg'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function processAI(userText) {
            let reply = "Je ne comprends pas bien, mais continuez !"; // Default
            
            // გრამატიკის მარტივი კონტროლი
            if(userText.includes("je est")) reply = "Attention ! On dit 'Je suis', pas 'Je est'.";
            else {
                for(let key in responses) {
                    if(userText.includes(key)) reply = responses[key];
                }
            }

            // პასუხის გაცემა დროის დაყოვნებით (თითქოს ფიქრობს)
            setTimeout(() => {
                addMessage(reply, 'ai');
                speak(reply);
            }, 600);
        }

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fr-FR';
            u.rate = 0.9;
            
            u.onstart = () => avatarImg.classList.add('talking');
            u.onend = () => avatarImg.classList.remove('talking');
            
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
