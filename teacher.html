<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professeur AI - Powered by Gemini</title>
    <style>
        :root { --main: #002395; --accent: #ed2939; --skin: #ffdbac; }
        body { margin: 0; background: #f0f2f5; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .avatar-container {
            background: white; padding: 25px; border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        /* ანიმაციური ადამიანი */
        .human { width: 120px; height: 140px; background: var(--skin); border-radius: 60px 60px 45px 45px; position: relative; border: 3px solid #333; }
        .hair { position: absolute; top: -12px; width: 130px; height: 50px; background: #3d2419; border-radius: 70px 70px 0 0; left: -8px; }
        .eye { position: absolute; top: 55px; width: 12px; height: 12px; background: #222; border-radius: 50%; }
        .eye.left { left: 30px; } .eye.right { right: 30px; }
        .mouth { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 25px; height: 8px; background: #a52a2a; border-radius: 4px; transition: 0.1s; }

        .talking .mouth { height: 25px; border-radius: 50%; animation: speakMove 0.15s infinite alternate; }
        @keyframes speakMove { from { height: 8px; } to { height: 25px; } }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #f8f9fa; }
        .bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 1rem; line-height: 1.4; }
        .ai { background: var(--main); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #e2e8f0; color: #1a202c; align-self: flex-end; border-bottom-right-radius: 2px; }

        .controls { padding: 20px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .mic-btn { width: 70px; height: 70px; border-radius: 50%; border: none; background: var(--accent); color: white; font-size: 28px; cursor: pointer; box-shadow: 0 5px 15px rgba(237,41,57,0.3); }
        .mic-btn.active { background: #2ecc71; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="avatar-container">
        <div class="human" id="character">
            <div class="hair"></div><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
        </div>
        <h3 style="margin: 10px 0 0; color: var(--main);">Professeur Gemini</h3>
        <p id="status" style="font-size: 0.7rem; color: #999;">Gemini AI ინტეგრირებულია</p>
    </div>

    <div id="chat">
        <div class="bubble ai">Bonjour ! Je suis Professeur Gemini. Je peux discuter de tout avec vous. Parlez-moi !</div>
    </div>

    <div class="controls">
        <button class="mic-btn" id="mic" onclick="startVoice()">🎤</button>
    </div>

    <script>
        const API_KEY = "შენი_API_KEY_აქ"; // <-- ჩასვი შენი Gemini API გასაღები აქ
        const chat = document.getElementById('chat');
        const character = document.getElementById('character');

        // Gemini-სთან დაკავშირება
        async function askGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "You are a French teacher. Respond only in French. Be brief, professional and helpful. If I make a grammatical mistake, correct it politely. My message: " + prompt }] }]
                })
            });

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // ხმის ამოცნობა
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'fr-FR';

        async function startVoice() {
            recognition.start();
            document.getElementById('mic').classList.add('active');
        }

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            addMsg(userText, 'user');
            
            document.getElementById('status').innerText = "Gemini ფიქრობს...";
            
            try {
                const aiText = await askGemini(userText);
                addMsg(aiText, 'ai');
                speak(aiText);
            } catch (error) {
                addMsg("AIzaSyCX9nmtRlgToL7gK54hWe3gkwxeJVA-c4k", 'ai');
            }
            
            document.getElementById('status').innerText = "მზად ვარ";
        };

        recognition.onend = () => document.getElementById('mic').classList.remove('active');

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `bubble ${type}`;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'fr-FR';
            utter.onstart = () => character.classList.add('talking');
            utter.onend = () => character.classList.remove('talking');
            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
