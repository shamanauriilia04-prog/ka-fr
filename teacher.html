<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professeur Gemini - Ultra AI</title>
    <style>
        :root { --ai-blue: #002395; --ai-red: #ed2939; --skin: #ffdbac; }
        body { margin: 0; background: #f0f4f8; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* მასწავლებლის ანიმაციური ვიზუალი */
        .header-ai {
            background: white; padding: 25px 0; display: flex; flex-direction: column; align-items: center;
            border-bottom: 2px solid #e1e8ed; box-shadow: 0 10px 25px rgba(0,0,0,0.05); z-index: 10;
        }

        .face {
            width: 130px; height: 155px; background: var(--skin); border-radius: 65px 65px 50px 50px;
            position: relative; border: 3px solid #333; transition: 0.3s;
        }

        .hair { position: absolute; top: -15px; width: 140px; height: 55px; background: #3d2419; border-radius: 70px 70px 0 0; left: -5px; }
        .eye { position: absolute; top: 55px; width: 14px; height: 14px; background: #222; border-radius: 50%; }
        .eye.left { left: 35px; } .eye.right { right: 35px; }
        
        .mouth {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 10px; background: #a52a2a; border-radius: 5px;
            transition: 0.1s; border: 1px solid rgba(0,0,0,0.1);
        }

        /* ლაპარაკის რეჟიმი */
        .talking .mouth {
            height: 35px; border-radius: 50%; animation: speakMove 0.15s infinite alternate;
        }
        @keyframes speakMove { from { height: 10px; } to { height: 35px; } }

        /* ჩეთის სტილი */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 20px; font-size: 1rem; line-height: 1.5; }
        .ai-msg { background: var(--ai-blue); color: white; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 4px 10px rgba(0,35,149,0.2); }
        .user-msg { background: #fff; color: #333; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* მართვის პანელი */
        .mic-container { padding: 30px; background: white; border-top: 1px solid #eee; display: flex; justify-content: center; }
        .mic-btn {
            width: 80px; height: 80px; border-radius: 50%; border: none;
            background: var(--ai-red); color: white; font-size: 35px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(237, 41, 57, 0.4); transition: 0.3s;
        }
        .mic-btn.listening { background: #2ecc71; transform: scale(1.1); animation: glow 1s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.4); } 100% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); } }
    </style>
</head>
<body>

    <div class="header-ai">
        <div class="face" id="face">
            <div class="hair"></div><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
        </div>
        <h2 style="margin: 15px 0 5px; color: var(--ai-blue);">Professeur Gemini</h2>
        <p id="status" style="font-size: 0.8rem; color: #888;">Gemini AI ცოცხალია და გისმენთ</p>
    </div>

    <div id="chat-window">
        <div class="bubble ai-msg">Bonjour ! Je suis Professeur Gemini. Je peux parler de tout, corriger vos fautes et vous enseigner le français. Que voulez-vous me dire ?</div>
    </div>

    <div class="mic-container">
        <button class="mic-btn" id="mic-btn" onclick="startRecognition()">🎤</button>
    </div>

    <script>
        // შენი API Key უკვე აქ არის
        const GEMINI_API_KEY = "AIzaSyCX9nmtRlgToL7gK54hWe3gkwxeJVA-c4k"; 
        const chatWindow = document.getElementById('chat-window');
        const face = document.getElementById('face');
        const micBtn = document.getElementById('mic-btn');

        // Gemini API-სთან დაკავშირება
        async function getGeminiResponse(userPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            
            const payload = {
                contents: [{
                    parts: [{
                        text: `You are an expert French teacher. Respond only in French. 
                               Keep it conversational, natural, and helpful. 
                               If the user makes a mistake, correct it gently. 
                               User said: "${userPrompt}"`
                    }]
                }]
            };

            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // ხმის ამოცნობა (Speech to Text)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'fr-FR';

        function startRecognition() {
            try {
                recognition.start();
                micBtn.classList.add('listening');
                document.getElementById('status').innerText = "გისმენთ...";
            } catch(e) {}
        }

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            addMessage(transcript, 'user-msg');
            
            document.getElementById('status').innerText = "Gemini ფიქრობს...";
            
            try {
                const aiResponse = await getGeminiResponse(transcript);
                addMessage(aiResponse, 'ai-msg');
                speak(aiResponse);
            } catch (error) {
                console.error(error);
                addMessage("Désolé, j'ai un problème de connexion.", 'ai-msg');
            }
            
            document.getElementById('status').innerText = "Professeur Gemini";
        };

        recognition.onend = () => micBtn.classList.remove('listening');

        function addMessage(text, className) {
            const b = document.createElement('div');
            b.className = `bubble ${className}`;
            b.innerText = text;
            chatWindow.appendChild(b);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ლაპარაკის ფუნქცია (Text to Speech)
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;

            utterance.onstart = () => face.classList.add('talking');
            utterance.onend = () => face.classList.remove('talking');

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
