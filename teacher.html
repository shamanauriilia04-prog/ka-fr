<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professeur AI - Ultimate Edition</title>
    <style>
        :root {
            --bg: #f4f7f9;
            --ai-blue: #002395;
            --ai-red: #ed2939;
            --skin: #ffdbac;
        }

        body { 
            margin: 0; font-family: 'Helvetica Neue', sans-serif; 
            background: var(--bg); display: flex; flex-direction: column; height: 100vh; 
            overflow: hidden;
        }

        /* AI-ს ვიზუალი - კოდით აწყობილი ანიმაციური ადამიანი */
        .ai-header {
            background: white; padding: 30px 0; text-align: center;
            border-bottom: 2px solid #eee; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
        }

        .character-box {
            width: 130px; height: 130px; background: var(--skin);
            border-radius: 50% 50% 45% 45%; margin: 0 auto;
            position: relative; border: 3px solid #333;
            transition: 0.3s;
        }

        .hair {
            position: absolute; top: -10px; width: 100%; height: 50px;
            background: #4b2c20; border-radius: 60px 60px 0 0;
        }

        .eye { 
            position: absolute; top: 55px; width: 12px; height: 12px; 
            background: #222; border-radius: 50%; transition: 0.2s;
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }

        .glasses {
            position: absolute; top: 50px; width: 100%; height: 30px;
            display: flex; justify-content: center; gap: 10px;
        }
        .lens { width: 35px; height: 35px; border: 2px solid #555; border-radius: 50%; }

        .mouth {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 25px; height: 8px; background: #c0392b; border-radius: 5px;
            transition: 0.15s;
        }

        /* ანიმაციები საუბრის დროს */
        .talking .mouth {
            height: 20px; border-radius: 50%;
            animation: mouthTalk 0.2s infinite alternate;
        }
        @keyframes mouthTalk { from { height: 10px; width: 25px; } to { height: 25px; width: 30px; } }

        /* ჩეთის სისტემა */
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .bubble {
            max-width: 80%; padding: 14px 18px; border-radius: 20px;
            font-size: 1rem; line-height: 1.4; position: relative;
        }
        .ai-msg { background: var(--ai-blue); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: #e2e8f0; color: #333; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* მართვის ღილაკი */
        .control-panel {
            padding: 25px; background: white; border-top: 1px solid #eee;
            display: flex; justify-content: center;
        }

        .mic-btn {
            width: 75px; height: 75px; border-radius: 50%; border: none;
            background: var(--ai-red); color: white; font-size: 30px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(237, 41, 57, 0.3); transition: 0.3s;
        }
        .mic-btn.listening { background: #2ecc71; animation: pulse 1.2s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(46, 204, 113, 0.5); } 100% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); } }
    </style>
</head>
<body>

    <div class="ai-header">
        <a href="index.html" style="position:absolute; left:20px; top:20px; text-decoration:none; font-size:24px;">←</a>
        <div class="character-box" id="avatar">
            <div class="hair"></div>
            <div class="glasses"><div class="lens"></div><div class="lens"></div></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth" id="mouth"></div>
        </div>
        <p id="ai-status" style="margin: 10px 0 0; font-weight: bold; color: var(--ai-blue);">Professeur AI</p>
    </div>

    <div id="chat-window">
        <div class="bubble ai-msg">Bonjour ! Je suis prêt. Parlez-moi de n'importe quel sujet en français ! (გამარჯობა! მე მზად ვარ. მესაუბრე ნებისმიერ თემაზე!)</div>
    </div>

    <div class="control-panel">
        <button class="mic-btn" id="mic" onclick="startRecognition()">🎤</button>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const avatar = document.getElementById('avatar');
        const aiStatus = document.getElementById('ai-status');

        // --- AI ინტელექტის ბირთვი (აქ არის მთელი მისი ცოდნა) ---
        const ProfesseurAI = {
            process: function(input) {
                input = input.toLowerCase().trim();
                
                // 1. გრამატიკული შემოწმება (Deep Check)
                if (input.includes("je est")) return "Attention ! On ne dit pas 'je est'. Le verbe être se conjugue : 'Je suis'. Répétez après moi : Je suis.";
                if (input.includes("tu est")) return "Presque ! N'oubliez pas le 's'. On dit 'Tu es'.";
                if (input.includes("je ai")) return "En français, on fait l'élision. On dit 'J'ai'.";

                // 2. დინამიური საუბრის ლოგიკა
                if (input.includes("bonjour")) return "Bonjour ! Quel plaisir de vous entendre. Comment se passe votre journée ?";
                if (input.includes("ça va") || input.includes("va bien")) return "Je vais à merveille ! L'intelligence artificielle n'est jamais fatiguée. Et vous ?";
                if (input.includes("qui es-tu") || input.includes("ton nom")) return "Je suis votre professeur personnel, créé pour vous aider à maîtriser la langue française.";
                if (input.includes("temps") || input.includes("météo")) return "Il fait toujours beau dans le monde numérique ! Et chez vous ?";
                if (input.includes("merci")) return "Je vous en prie ! C'est un plaisir de vous aider.";
                
                // 3. გენერალური პასუხი ნებისმიერ სხვა რამეზე (რომ ყველაფერზე ჰქონდეს პასუხი)
                return "C'est une phrase très intéressante. Votre prononciation s'améliore ! Pouvez-vous m'en dire plus sur ce sujet ?";
            }
        };

        // ხმის ამოცნობის კონფიგურაცია
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.interimResults = false;

        function startRecognition() {
            try {
                recognition.start();
                document.getElementById('mic').classList.add('listening');
                aiStatus.innerText = "გისმენთ...";
            } catch(e) {}
        }

        recognition.onresult = (event) => {
            const userText = event.results[0][0].transcript;
            addMessage(userText, 'user-msg');
            
            // AI აანალიზებს და პასუხობს
            const response = ProfesseurAI.process(userText);
            
            setTimeout(() => {
                addMessage(response, 'ai-msg');
                speak(response);
            }, 600);
        };

        recognition.onend = () => {
            document.getElementById('mic').classList.remove('listening');
            aiStatus.innerText = "Professeur AI";
        };

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9; // ოდნავ ნელი ტემპი სწავლისთვის
            utterance.pitch = 1.0;

            utterance.onstart = () => avatar.classList.add('talking');
            utterance.onend = () => avatar.classList.remove('talking');

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
