<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>კონსტრუქტორი - Bonjour</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --const-color: #6c5ce7; }
        
        .progress-header { padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
        .bar-bg { flex: 1; height: 8px; background: #eee; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--const-color); width: 0%; transition: 0.4s; }

        .game-area { padding: 20px; text-align: center; min-height: 400px; }
        .target-sentence { 
            font-size: 1.3rem; font-weight: bold; color: #2d3436; margin-bottom: 10px; 
            min-height: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;
        }
        .translation-hint { color: #636e72; font-size: 1rem; margin-bottom: 30px; display: block; }

        /* არჩეული სიტყვების ზონა */
        .drop-zone {
            min-height: 60px; border: 2px dashed #ddd; border-radius: 15px;
            margin-bottom: 30px; display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; padding: 10px; background: #fafafa;
        }

        /* სიტყვების ღილაკები */
        .word-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .word-tile {
            background: white; border: 2px solid #eee; padding: 12px 20px;
            border-radius: 12px; cursor: pointer; font-weight: 500;
            box-shadow: 0 4px 0 #eee; transition: 0.2s; user-select: none;
        }
        .word-tile:active { transform: translateY(2px); box-shadow: 0 2px 0 #eee; }
        .word-tile.used { opacity: 0; pointer-events: none; }

        .word-in-zone {
            background: var(--const-color); color: white; padding: 10px 18px;
            border-radius: 12px; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .feedback-area { margin-top: 20px; min-height: 50px; font-weight: bold; }
        .info-circle {
            display: inline-block; width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid var(--const-color); color: var(--const-color);
            cursor: pointer; font-size: 14px; line-height: 22px; margin-left: 10px;
        }

        .controls { margin-top: 40px; display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--const-color);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>კონსტრუქტორი</h1>
            <p>ააწყვე წინადადება</p>
        </div>

        <div class="progress-header">
            <span id="progress-text">1/20</span>
            <div class="bar-bg"><div id="progress-fill" class="bar-fill"></div></div>
        </div>

        <div class="game-area">
            <span class="translation-hint" id="ka-sentence">მე ვარ სტუდენტი</span>
            <div class="drop-zone" id="drop-zone" onclick="clearLast()"></div>
            <div class="word-pool" id="word-pool"></div>

            <div class="feedback-area" id="feedback"></div>
            
            <div id="explanation" style="display:none; background:#f0f4ff; padding:15px; border-radius:15px; margin-top:15px; font-size:0.85rem; color:#333;">
            </div>

            <div class="controls">
                <button onclick="checkSentence()" class="nav-btn" style="background:var(--const-color); color:white; border:none;">შემოწმება</button>
                <button onclick="showHint()" class="info-circle" title="დახმარება">?</button>
            </div>
        </div>
    </div>

    <script>
        const tasks = [
            { fr: "Je suis étudiant", ka: "მე ვარ სტუდენტი", hint: "ფრანგულში 'ვარ' არის 'suis'. პირველი მოდის ნაცვალსახელი 'Je'." },
            { fr: "Tu es français", ka: "შენ ხარ ფრანგი", hint: "'Tu' ყოველთვის მოითხოვს ზმნის ფორმას 'es'." },
            { fr: "J'ai un chat", ka: "მე მაქვს კატა", hint: "როცა 'Je' ხვდება ხმოვანს (ai), ის ხდება J'." },
            { fr: "Il est professeur", ka: "ის არის მასწავლებელი", hint: "'Il' არის მამრობითი სქესის 'ის'. ზმნა არის 'est'." },
            { fr: "Elle a une pomme", ka: "მას აქვს ვაშლი", hint: "'Elle' არის მდედრობითი სქესის 'ის'. 'A' ნიშნავს 'აქვს'." },
            { fr: "Nous sommes amis", ka: "ჩვენ ვართ მეგობრები", hint: "'Nous' ნიშნავს ჩვენ. 'Sommes' არის ყოფნა (ვართ)." },
            { fr: "Vous avez faim", ka: "თქვენ გაქვთ შიმშილი (გშიათ)", hint: "'Vous' არის თქვენ. 'Avez' არის ქონა (გაქვთ)." },
            { fr: "Ils sont ici", ka: "ისინი არიან აქ", hint: "'Sont' გამოიყენება მრავლობითში 'ისინი'-სთვის." },
            { fr: "C'est ma famille", ka: "ეს ჩემი ოჯახია", hint: "'C'est' ნიშნავს 'ეს არის'." },
            { fr: "Le ciel est bleu", ka: "ცაც ლურჯია", hint: "ფერი ყოველთვის ზმნის შემდეგ მოდის." },
            { fr: "Je veux un café", ka: "მე მინდა ყავა", hint: "'Veux' ნიშნავს 'მინდა'." },
            { fr: "Il fait beau", ka: "კარგი ამინდია", hint: "ამინდზე საუბრისას ვიყენებთ ზმნას 'Faire' (Fait)." },
            { fr: "Comment allez vous", ka: "როგორ ხართ?", hint: "ოფიციალური შეკითხვაა." },
            { fr: "Je parle français", ka: "მე ვსაუბრობ ფრანგულად", hint: "'Parle' არის საუბარი." },
            { fr: "La pomme est rouge", ka: "ვაშლი წითელია", hint: "მდედრობითი სქესის არტიკლია 'La'." },
            { fr: "Où est le chat", ka: "სად არის კატა?", hint: "'Où' ნიშნავს 'სად'." },
            { fr: "J'aime le fromage", ka: "მე მიყვარს ყველი", hint: "'Aime' არის სიყვარული." },
            { fr: "Tu as quel âge", ka: "შენ რამდენი წლის ხარ?", hint: "ფრანგულში ვამბობთ: 'შენ გაქვს რა ასაკი'." },
            { fr: "Il est midi", ka: "შუადღეა", hint: "დროზე საუბრისას ვიყენებთ 'Il est'." },
            { fr: "Bonne nuit maman", ka: "ღამე მშვიდობისა დედა", hint: "Bonne nuit გამოიყენება ძილის წინ." }
        ];

        let currentIdx = 0;
        let selectedWords = [];

        function initTask() {
            const task = tasks[currentIdx];
            document.getElementById('ka-sentence').innerText = task.ka;
            document.getElementById('feedback').innerText = "";
            document.getElementById('explanation').style.display = "none";
            document.getElementById('drop-zone').innerHTML = "";
            selectedWords = [];
            
            // პროგრესი
            document.getElementById('progress-text').innerText = `${currentIdx + 1}/${tasks.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / tasks.length) * 100}%`;

            // სიტყვების არევა
            let words = task.fr.split(' ');
            // დავამატოთ 1-2 ზედმეტი სიტყვა სირთულისთვის
            words.push("pas", "très"); 
            words = words.sort(() => Math.random() - 0.5);

            const pool = document.getElementById('word-pool');
            pool.innerHTML = words.map((w, i) => `
                <div class="word-tile" id="word-${i}" onclick="addWord('${w}', 'word-${i}')">${w}</div>
            `).join('');
        }

        function addWord(word, id) {
            selectedWords.push(word);
            document.getElementById(id).classList.add('used');
            renderDropZone();
        }

        function renderDropZone() {
            const zone = document.getElementById('drop-zone');
            zone.innerHTML = selectedWords.map(w => `<div class="word-in-zone">${w}</div>`).join('');
        }

        function clearLast() {
            if(selectedWords.length === 0) return;
            selectedWords = [];
            initTask(); // თავიდან დაწყება ამ სავარჯიშოსთვის
        }

        function checkSentence() {
            const userSentence = selectedWords.join(' ');
            const target = tasks[currentIdx].fr;
            const feedback = document.getElementById('feedback');

            if(userSentence === target) {
                feedback.innerText = "✨ სწორია! ბრწყინვალეა!";
                feedback.style.color = "#2ecc71";
                speak(target);
                setTimeout(() => {
                    if(currentIdx < tasks.length - 1) {
                        currentIdx++;
                        initTask();
                    } else {
                        feedback.innerText = "🏆 გილოცავ! შენ დაასრულე კურსი!";
                    }
                }, 2000);
            } else {
                feedback.innerText = "❌ არასწორია, სცადე თავიდან";
                feedback.style.color = "#e74c3c";
            }
        }

        function showHint() {
            const exp = document.getElementById('explanation');
            exp.innerText = tasks[currentIdx].hint;
            exp.style.display = exp.style.display === "none" ? "block" : "none";
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            speechSynthesis.speak(u);
        }

        initTask();
    </script>
</body>
</html>
