<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>კონსტრუქტორი - Bonjour</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --const-color: #6c5ce7; }
        .game-area { padding: 15px; text-align: center; }
        .progress-bar { height: 8px; background: #eee; border-radius: 20px; margin: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--const-color); width: 0%; transition: 0.4s ease; }
        .drop-zone { min-height: 90px; border: 2px dashed #d1d8e0; border-radius: 20px; margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 15px; background: #fdfdfd; }
        .word-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .word-tile { background: white; border: 1px solid #ddd; padding: 12px 18px; border-radius: 15px; cursor: pointer; font-weight: 500; box-shadow: 0 3px 0 #eee; transition: 0.1s; }
        .word-tile.disabled { opacity: 0.2; pointer-events: none; }
        .selected-word { background: var(--const-color); color: white; padding: 10px 15px; border-radius: 12px; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .controls-row { display: flex; justify-content: center; gap: 12px; margin-top: 25px; }
        .btn-circle { width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .mic-btn { background: #ff4757; color: white; }
        .mic-btn.recording { animation: pulse 1.5s infinite; }
        .check-btn { background: var(--const-color); color: white; border-radius: 30px; padding: 0 30px; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header" style="background: var(--const-color);">
            <a href="index.html" style="color:white; float:left; text-decoration:none;">←</a>
            <h1>კონსტრუქტორი</h1>
            <p id="task-counter">1 / 50</p>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="game-area">
            <h2 id="ka-sentence">...</h2>
            <div class="drop-zone" id="drop-zone"></div>
            <div class="word-pool" id="word-pool"></div>
            <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
            <div class="controls-row">
                <button class="btn-circle" onclick="undo()">↺</button>
                <button class="btn-circle mic-btn" id="mic-btn" onclick="startListening()">🎤</button>
                <button class="action-btn check-btn" onclick="checkAnswer()">შემოწმება</button>
            </div>
        </div>
    </div>

    <script>
        const database = [
            { fr: "Je suis étudiant", ka: "მე ვარ სტუდენტი" },
            { fr: "J'ai un chat", ka: "მე მაქვს კატა" },
            { fr: "L'addition s'il vous plaît", ka: "ანგარიში თუ შეიძლება" },
            { fr: "C'est délicieux", ka: "გემრიელია" },
            { fr: "Il y a un livre", ka: "აქ არის წიგნი" },
            { fr: "Je t'aime maman", ka: "მიყვარხარ დედა" },
            { fr: "L'hôtel არის grand", ka: "სასტუმრო დიდია" },
            { fr: "Où არის la gare", ka: "სად არის სადგური?" },
            { fr: "Je m'appelle Marc", ka: "მე მქვია მარკი" },
            { fr: "Tu as faim", ka: "გშია?" },
            // ... (აქ დაემატება სხვა 40 წინადადებაც იგივე პრინციპით)
        ];

        let currentIdx = 0;
        let selectedWords = [];
        let usedIds = [];

        function loadTask() {
            const task = database[currentIdx];
            document.getElementById('ka-sentence').innerText = task.ka;
            document.getElementById('task-counter').innerText = `${currentIdx + 1} / ${database.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx+1)/database.length)*100}%`;
            document.getElementById('drop-zone').innerHTML = "";
            document.getElementById('feedback').innerText = "";
            selectedWords = [];
            usedIds = [];

            // აპოსტროფიანი სიტყვების სწორი დაყოფა (L'addition რჩება ერთ სიტყვად)
            let words = task.fr.split(' ');
            words = words.sort(() => Math.random() - 0.5);

            const pool = document.getElementById('word-pool');
            pool.innerHTML = words.map((w, i) => `
                <div class="word-tile" id="t-${i}" onclick="addWord(\`${w}\`, 't-${i}')">${w}</div>
            `).join('');
        }

        function addWord(word, id) {
            selectedWords.push(word);
            usedIds.push(id);
            document.getElementById(id).classList.add('disabled');
            render();
        }

        function undo() {
            if(!selectedWords.length) return;
            selectedWords.pop();
            const id = usedIds.pop();
            document.getElementById(id).classList.remove('disabled');
            render();
        }

        function render() {
            document.getElementById('drop-zone').innerHTML = selectedWords.map(w => `<div class="selected-word">${w}</div>`).join('');
        }

        function checkAnswer() {
            const user = selectedWords.join(' ').replace(/[‘’]/g, "'");
            const target = database[currentIdx].fr.replace(/[‘’]/g, "'");
            
            if(user === target) {
                document.getElementById('feedback').innerText = "✅ სწორია!";
                const u = new SpeechSynthesisUtterance(target);
                u.lang = 'fr-FR';
                speechSynthesis.speak(u);
                setTimeout(() => { currentIdx++; loadTask(); }, 1500);
            } else {
                document.getElementById('feedback').innerText = "❌ შეცდომაა";
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return;
            const rec = new SpeechRecognition();
            rec.lang = 'fr-FR';
            rec.onstart = () => document.getElementById('mic-btn').classList.add('recording');
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.replace(/[.?!]/g, "").replace(/[‘’]/g, "'");
                // AI Logic: თუ ნათქვამი ემთხვევა პასუხს
                if(text.toLowerCase() === database[currentIdx].fr.toLowerCase()) {
                    selectedWords = database[currentIdx].fr.split(' ');
                    render();
                    checkAnswer();
                }
            };
            rec.onend = () => document.getElementById('mic-btn').classList.remove('recording');
            rec.start();
        }
        loadTask();
    </script>
</body>
</html>
